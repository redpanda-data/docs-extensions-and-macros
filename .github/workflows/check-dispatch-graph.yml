name: Dispatch graph health

# Runs `doc-tools check-dispatch-graph` on a schedule and files or updates ONE
# issue in this repo, labelled dispatch-graph, when it finds a broken edge in
# the repository_dispatch graph between the engineering repos and the docs
# repos.
#
# Why a schedule: a repository_dispatch is accepted with HTTP 204 whether or
# not a workflow listens for it, and a receiver that fails on every run looks,
# from the sender's side, exactly like one that works. Every break this check
# reports (a listener deleted when a chart moved, a release event that never
# fires because the release is cut with GITHUB_TOKEN, a receiver failing 48 of
# 48 runs at "Commit changes") happened in ANOTHER repo with no file change
# here, so no PR-triggered check could ever see it. The 2026-10-22 audit found
# six of these by hand after weeks; this finds them by script.
#
# The bash lives in .github/scripts/check-dispatch-graph.sh, which the last
# step runs from the checkout; __tests__/workflows/check-dispatch-graph.test.js
# asserts that and exercises every exit path against a stubbed gh.

on:
  schedule:
    # Mondays 08:00 UTC, after the Kapa (06:00) and property-corpus (07:00)
    # drift checks so the three never contend for the same bot token.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    name: Check the dispatch graph
    runs-on: ubuntu-latest
    steps:
      # The bot token is what makes the check possible at all: eight of the
      # sixteen repos are private, and github.token cannot read workflow
      # files or Actions runs outside this repo. Fetched only on the default
      # branch, same boundary as kapa-source-groups-drift.yml: workflow_dispatch
      # can be aimed at any branch a user with write access selects, and
      # checkout below has no explicit ref, so a modified script on that
      # branch would otherwise run holding the org token. A dispatch off main
      # runs without it, reports what github.token can see, and exits 2
      # because the private half is unreadable; that is the intended result
      # for someone testing the workflow on a branch.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}

      - name: Get the bot token
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci then npx --no-install, deliberately: an unpinned npx would
      # resolve whatever doc-tools release is newest, so this check could
      # change or start failing with no change in this repo.
      - name: Install dependencies
        run: npm ci

      - name: Check the dispatch graph
        env:
          # The org bot token reads the private repos and their runs, and
          # files the issue. Empty off main, in which case the check exits 2.
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
          ISSUE_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          # Only a run against main may file an issue. A workflow_dispatch from
          # a work-in-progress branch reports and fails, but files nothing.
          GITHUB_REF: ${{ github.ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/check-dispatch-graph.sh
