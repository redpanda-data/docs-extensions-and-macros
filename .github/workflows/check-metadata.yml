---
name: Check page metadata
# Reusable PR check: `doc-tools check-metadata` on the pages a pull request
# changes. It checks :page-categories: and the solution facet values against
# the docs taxonomy (taxonomy.yml in redpanda-data/docs), with the same rules
# the Antora build runs, and needs no model, so it belongs to the "tests, no
# model" layer of the docs automation.
#
# Warn by default: Product Docs pages still carry deprecated categories until
# they are rewritten, and a check that turns every PR red teaches people to
# ignore it. Errors still fail (an unknown value on a solution overview, for
# example). Set strict: true to fail on warnings too.
#
# A caller, in a docs repository:
#
#   on:
#     pull_request:
#       paths: ['**/*.adoc']
#   jobs:
#     metadata:
#       uses: redpanda-data/docs-extensions-and-macros/.github/workflows/check-metadata.yml@<sha>
#       with:
#         doc_tools_version: <exact version>
#
# The taxonomy comes from the caller's checkout when it is the docs repo, and
# from https://docs.redpanda.com/shared/_attachments/taxonomy.yml otherwise.
#
# With suggest (the default), the check also runs --suggest: the taxonomy
# values a changed page's text names that its header does not carry, at the
# default minimum score, with evidence. They go to the job summary, to a
# notice on the attribute line (or the page's first line when the page has no
# such attribute), and to the result JSON under `suggest`, apart from
# `findings`. Suggestions never fail the job, strict or not. A
# doc_tools_version from before suggestions carried their line puts every
# notice on line 1.
#
# With recommendations (off by default until a doc-tools release ships the
# subcommand), it also runs `doc-tools recommendations-diff`: which solution
# recommendations the changed pages' categories, or a changed solution
# overview's facets, add, remove, or rerank, scored by the solutions-catalog
# extension's own code against the doc-concepts.json a published build
# wrote. No site build and no model. It is informational and never fails the
# job; when the published data cannot be read (no Solutions build at the
# origin yet), it is skipped with a notice.

on:
  workflow_call:
    inputs:
      doc_tools_version:
        description: >-
          Published @redpanda-data/docs-extensions-and-macros version to run
          `doc-tools check-metadata` from. Exact version, never a range or a
          tag, so a release cannot change a PR check without a deliberate
          bump. It must be a release that ships check-metadata.
        type: string
        required: true
      strict:
        description: Fail on warnings as well as errors.
        type: boolean
        default: false
      paths:
        description: >-
          Space-separated files, directories, or globs that limit the changed
          pages checked, for example `modules docs/modules`. Empty checks every
          changed .adoc file.
        type: string
        default: ''
      taxonomy:
        description: >-
          taxonomy.yml path (in the caller's checkout) or URL. Empty uses the
          checkout's shared/modules/ROOT/attachments/taxonomy.yml when there is
          one, else the published file.
        type: string
        default: ''
      recommendations:
        description: >-
          Also report the solution recommendations the PR adds, removes, or
          reranks (`doc-tools recommendations-diff`), in the job summary.
          Never fails the job. Needs a doc_tools_version that ships
          recommendations-diff; an earlier one is skipped with a notice.
          Off by default until a doc-tools release ships recommendations-diff.
        type: boolean
        default: false
      recommendations_origin:
        description: >-
          Site to read assets/data/doc-concepts.json (and the taxonomy, when
          the checkout has none) from, for example a deploy preview while
          Solutions are not on docs.redpanda.com. Empty uses
          https://docs.redpanda.com.
        type: string
        default: ''
      suggest:
        description: >-
          Also suggest taxonomy values the changed pages' text names that
          their headers do not carry (`check-metadata --suggest`), in the job
          summary and as notices. Suggestions never fail the job.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Exit 1 on errors (or warnings with strict), 2 when the check could not
      # run (no taxonomy, an invalid taxonomy). Every finding is also an
      # annotation on the changed line.
      - name: Check page metadata
        env:
          BASE: origin/${{ github.base_ref }}
          DOC_TOOLS_VERSION: ${{ inputs.doc_tools_version }}
          STRICT: ${{ inputs.strict }}
          PATHS: ${{ inputs.paths }}
          TAXONOMY: ${{ inputs.taxonomy }}
          SUGGEST: ${{ inputs.suggest }}
        run: |
          args=(check-metadata --changed "$BASE" --output check-metadata.json)
          if [ "$STRICT" = "true" ]; then args+=(--strict); fi
          if [ "$SUGGEST" = "true" ]; then args+=(--suggest); fi
          if [ -n "$TAXONOMY" ]; then args+=(--taxonomy "$TAXONOMY"); fi
          # Word-splitting PATHS is intended: it is a space-separated list. No
          # globbing here; check-metadata expands globs itself.
          set -f
          # shellcheck disable=SC2206
          if [ -n "$PATHS" ]; then args+=($PATHS); fi

          set +e
          npx --yes --package "@redpanda-data/docs-extensions-and-macros@${DOC_TOOLS_VERSION}" \
            doc-tools "${args[@]}" > check-metadata.txt 2>&1
          status=$?
          set -e

          cat check-metadata.txt
          {
            echo '### Page metadata'
            echo
            echo '```'
            cat check-metadata.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s check-metadata.json ]; then
            jq -r '.findings[] | "::\(.severity) file=\(.file),line=\(.line),title=check-metadata \(.rule)::\(.message)"' check-metadata.json
          elif [ "$status" -ne 2 ]; then
            # No result file but no usage error either: the pinned version
            # predates check-metadata, or npx failed. Never a silent pass.
            echo "::error::doc-tools check-metadata wrote no result at doc_tools_version=${DOC_TOOLS_VERSION}"
            exit 2
          fi
          exit "$status"

      # Informational only: this step exits 0 whatever it finds, so strict
      # never applies to it. A suggestion is a value at or above the default
      # minimum score that the page does not carry (every suggestion on a
      # page without page-categories qualifies the same way). At most 10
      # notices, the most GitHub shows per step; the summary lists all of them.
      - name: Report taxonomy suggestions
        if: always() && inputs.suggest
        run: |
          set -uo pipefail
          R=check-metadata.json
          if [ ! -s "$R" ] || ! jq -e '(.suggest.suggestions | type) == "array"' "$R" > /dev/null 2>&1; then
            echo "check-metadata: no suggestions in the result"
            exit 0
          fi
          # Workflow-command escaping: % and newlines in the message.
          jq -r '
            def esc: gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def ev: [.evidence[:3][] | "\"\(.term)\" in the \(.location)"] | join(", ");
            .suggest.suggestions | sort_by(.file, -.score) | .[:10][]
            | "::notice file=\(.file),line=\(.line // 1),title=check-metadata suggestion::"
              + ("Consider \(.label) (\(.facet) \(.conceptId)) in :\(.attribute):, score \(.score): \(.reason)" + (if (.evidence | length) > 0 then "; " + ev else "" end) | esc)
          ' "$R"
          jq -r '
            def cell: tostring | gsub("\\|"; "\\|") | gsub("\n"; " ");
            def ev: .file as $f | [.evidence[:3][] | "`\(.term)` \(if .location == "path" then "in the path" else "\(.location), \(if .source and .source != $f then "\(.source):" else "line " end)\(.line)" end)"] | join("; ");
            .suggest as $s
            | ($s.suggestions | length) as $n
            | "### Suggested taxonomy values", "",
              (if $n == 0 then "No suggestions: the changed pages carry what their text names at or above the minimum score (\($s.minScore.docs) on Product Docs pages, \($s.minScore.solution) on solution overviews)."
               else "\($n) suggestion(s) at or above the minimum score (\($s.minScore.docs) on Product Docs pages, \($s.minScore.solution) on solution overviews). They never fail the check; choose the values that fit and add them to the page header.", "",
                 "| Page | Attribute | Value | Score | Evidence |", "|---|---|---|---|---|",
                 ($s.suggestions | sort_by(.file, -.score)[]
                   | "| `\(.file):\(.line // 1)`\(if .uncategorized then " (no page-categories yet)" else "" end) | `:\(.attribute):` | \(.label) (`\(.conceptId)`) | \(.score) | \(.reason | cell); \(ev | cell) |")
               end),
              (($s.uncategorized // []) | map(select(.suggestions == 0)) | if length > 0 then "", "Pages with no page-categories whose text names no concept above the minimum score: " + (map("`\(.file)`") | join(", ")) + "." else empty end),
              (($s.needs // []) | if length > 0 then "", (.[] | "- `\(.file)`: \(.message)") else empty end),
              ""
          ' "$R" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"check-metadata: \(.suggest.suggestions | length) suggestion(s) for \(.suggest.suggestions | map(.file) | unique | length) page(s)"' "$R"

      # Informational only: always exits 0. The CLI writes its own summary
      # section; a run that could not compare anything says why in a notice.
      - name: Report recommendation changes
        if: always() && inputs.recommendations
        env:
          BASE: origin/${{ github.base_ref }}
          DOC_TOOLS_VERSION: ${{ inputs.doc_tools_version }}
          ORIGIN: ${{ inputs.recommendations_origin }}
          TAXONOMY: ${{ inputs.taxonomy }}
        run: |
          set -uo pipefail
          args=(recommendations-diff --changed "$BASE" --output recommendations-diff.json --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$ORIGIN" ]; then args+=(--origin "$ORIGIN"); fi
          if [ -n "$TAXONOMY" ]; then args+=(--taxonomy "$TAXONOMY"); fi
          rc=0
          npx --yes --package "@redpanda-data/docs-extensions-and-macros@${DOC_TOOLS_VERSION}" \
            doc-tools "${args[@]}" > recommendations-diff.txt 2>&1 || rc=$?
          cat recommendations-diff.txt
          if [ -s recommendations-diff.json ] && jq -e '.status | type == "string"' recommendations-diff.json > /dev/null 2>&1; then
            if [ "$(jq -r .status recommendations-diff.json)" != ok ]; then
              echo "::notice title=recommendations-diff::Recommendations not checked: $(jq -r '.reason // "unknown reason"' recommendations-diff.json)"
            fi
          elif grep -q "unknown command 'recommendations-diff'" recommendations-diff.txt; then
            echo "::notice title=recommendations-diff::doc-tools ${DOC_TOOLS_VERSION} has no recommendations-diff; recommendations are not checked until doc_tools_version names a release that ships it"
          else
            echo "::notice title=recommendations-diff::doc-tools recommendations-diff could not run (exit ${rc}); see the step log"
          fi
          exit 0

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-metadata
          path: |
            check-metadata.json
            recommendations-diff.json
          if-no-files-found: ignore
