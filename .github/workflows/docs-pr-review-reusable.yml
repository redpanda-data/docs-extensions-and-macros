# Reusable docs PR review pipeline. Called by the thin docs-review.yml
# caller in each in-scope repo (template: .github/docs-review-caller-template.yml).
#
# Scope, re-review and approval rules live in .github/docs-review-config.json
# in docs-team-standards, read at the caller's plugin_ref, so they change
# without editing this file or any caller:
#   - which repos are reviewed (scope.include_repos), and which PRs are
#     exempt: the ADP repos, and the reference and rpk automations' PRs
#     ("auto-docs:" titles and their branches);
#   - incremental re-review: after any earlier doc review on the PR (this
#     pipeline's report, or a review by anyone), only the commits since
#     that review's head SHA are reviewed;
#   - approval: a PR that passes the review is approved, with any
#     non-blocking suggestions listed in the approval. Review feedback that
#     says the PR is ready for approval, on the current head, is approved
#     without a re-review.
# There is no SME step: the review never waits for an SME approval. (The
# daily sme-nag still asks authors to tag an SME, but nothing here waits.)
#
# What never gets reviewed here (gate exits without touching the PR: no
# comment, review, label or status):
#   - draft PRs — marking a PR "ready for review" is the review-now button
#   - PRs out of scope per the config (repo not included, ADP, auto-docs)
#   - bot-authored PRs (GitHub Apps, plus the `bot_logins` service accounts,
#     e.g. vbotbuildovich) unless the caller sets bot_pr_policy: review
#   - PRs matching a caller's skip_branch_patterns / skip_title_patterns
#   - fork PRs (derived in the gate from the PR object, not trusted
#     from the caller's `if`, which cannot see head.repo on a
#     repository_dispatch event)
#   - PRs with no new commits since the last doc review (and no
#     ready-for-approval feedback to act on)
#
# HOSTING: this is the CANONICAL copy (public host, next to the
# doc-strings review that runs the same host/skills split in production).
# Callers reference
#   redpanda-data/docs-extensions-and-macros/.github/workflows/docs-pr-review-reusable.yml@<SHA>
# The SKILLS stay in docs-team-standards and are read at runtime (pinned
# checkout inside the claude-skill action) — only the host lives here. The
# twin copy in docs-team-standards (PR #2912, DOC-2496) is the review and
# dogfood path; keep the two in sync until dogfooding moves here. Neither
# host publishes git tags (`git ls-remote --tags` is empty), so @v1 is an
# unresolvable ref: pin a commit SHA per caller.
#
# TWO-STEP PIN after this PR merges: the claude-skill `uses:` refs below
# say @main because an action cannot reference its own not-yet-existing
# SHA. Step 1: merge this PR (SHA-1). Step 2: a one-line follow-up commit
# replaces @main with SHA-1 in every claude-skill ref (SHA-2). Callers
# then pin @SHA-2 — from that point nothing in the pipeline floats.
#
# Design doc + decision record: https://claude.ai/code/artifact/36e1362f-11d3-4532-8fe1-a5191c8def9f
#
# Ordering contract: the review runs at most once per (PR, head SHA), and it
# never merges anything. The pipeline may approve; wherever branch
# protection requires a code-owner review, the docs-team CODEOWNERS approval
# is still the merge gate.
#
# `docs-review` is a COMMIT STATUS, not a label: the workflow writes it on
# the PR's head SHA and it shows up in the PR's checks list. pending =
# review running, success/failure = the review's verdict. It is
# informational — nothing here blocks a merge. The labels the workflow
# applies (`needs-human-review`, `screenshot-standards`) are listed in
# .github/DOCS_REVIEW_ROLLOUT.md.
#
# Exactly-once = two layers: the caller's `concurrency` group serializes
# runs per PR (primary; every caller must keep it), and the gate CLAIMS the
# head SHA with a pending status naming its run id before any paid job
# starts (backstop for a caller that dropped the group). A completed
# success/failure status on the SHA ends the matter for good.
#
# Trust boundary: the PR head is untrusted. The claude-skill action strips
# project-level Claude config (.claude/, .mcp.json) from it, replaces every
# CLAUDE.md in the head with the BASE branch's copies (repo-local rules are
# honoured, but a PR cannot rewrite the rules it is reviewed against),
# strips `allowed-tools:` grants from the plugin's command frontmatter (in
# -p mode those grants widen the CLI allowlist — a bare `Bash` grant would
# void the sandbox), runs Claude with a read-only `gh` shim on PATH and no
# tree-mutating git verbs, never persists git credentials in any checkout,
# and refuses an unpinned plugin_ref. Repo-private skills are fetched with a
# per-run App token scoped to docs-team-standards with Contents: read.

name: docs-pr-review (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      # ── ADP AI Gateway auth (docs-pr-review agent's service account) ───
      # No Anthropic API key anywhere: model auth is the gateway, which
      # gives per-account spend attribution on the ADP cost page. All nine
      # callers were granted the docs-pr-review credential in devprod-infra
      # #826 (merged 2026-09-18).
      sme_gate:
        description: >-
          DEPRECATED, ignored. The review no longer waits for an SME
          approval in any repo. Kept so callers that still pass it do not
          fail with "unexpected input"; remove it from callers at the next
          pin bump.
        type: boolean
        default: false
      bot_pr_policy:
        description: >-
          What to do with bot-authored PRs (GitHub App authors, plus the
          logins in bot_logins). "skip" (default): no review at all — the
          writers run the deterministic checks by hand. "review": run the
          automated review. Either way, the reference and rpk automations'
          PRs are exempt through the config (scope.exempt), whatever this
          says.
        type: string
        default: 'skip'
      bot_logins:
        description: >-
          Comma-separated service-account logins that count as bots even
          though GitHub types them as User (vbotbuildovich opens the
          auto-docs / dependency-bump PRs across the docs repos).
        type: string
        default: 'vbotbuildovich'
      skip_branch_patterns:
        description: >-
          Newline-separated shell globs; a PR whose head branch matches any
          of them is never reviewed by this pipeline (e.g. claude/docs-updates-*
          in adp-docs, whose daily sync PRs already have a dedicated critic).
        type: string
        default: ''
      skip_title_patterns:
        description: >-
          Newline-separated extended regexes; a PR whose title matches any of
          them is never reviewed by this pipeline.
        type: string
        default: ''
      aws_region:
        description: RP_AWS_CRED_REGION org variable
        type: string
        required: true
      aws_role_name_prefix:
        description: RP_AWS_CRED_BASE_ROLE_NAME org variable (caller repo name is appended)
        type: string
        required: true
      use_adp_gateway:
        description: Present for shim symmetry with the doc-strings review; the gateway is the only auth path here.
        type: boolean
        default: true
      adp_client_secret_id:
        description: >-
          Secrets Manager id of the ADP OAuth client. The JSON key names
          inside derive from the secret's own last path segment
          (DOCS_PR_REVIEW_CLIENT_ID/_SECRET here, not ADP_PRIV_CLIENT_*),
          and the mint and scrub steps derive that prefix from this value
          rather than hardcoding it, so pointing this at another secret
          actually works. ATTRIBUTION: this is the docs-pr-review agent's own
          credential, which is what puts this review's spend on its own line
          on Cost and usage instead of inside doc-detective's
          (docs_team_agents_client is that agent's credential). Cost and usage
          attributes per agent and tags are per-agent and static, so sharing
          one secret between two workloads collapses their spend permanently.
          The secret was created and granted in devprod-infra#826 (merged
          2026-09-18). If it is missing for a repo, the fetch fails and every
          review degrades to "automated review unavailable".
        type: string
        default: 'sdlc/prod/github/docs_pr_review_client'
      plugin_ref:
        description: >-
          Commit SHA of redpanda-data/docs-team-standards checked out as the
          skills plugin at runtime. EVERY CALLER MUST PASS IT: there is no
          usable default, and the gate holds the PR pending (never a silent
          skill-less review) when it is not a full SHA. The dogfood caller
          passes its own PR head SHA; every other caller pins a verified SHA
          and bumps it deliberately — it is the rollback unit.
        type: string
        default: ''
      doc_tools_version:
        description: >-
          Published @redpanda-data/docs-extensions-and-macros version whose
          `doc-tools lint-screenshots` runs the deterministic screenshot
          checks — the same command cloud-docs runs on every PR and in its
          daily screenshot cron. Exact version, never a range or a tag.
          5.45.0 is the release that first ships that subcommand (#313). Every
          earlier version, including the 5.38.0 this used to name, exits 1
          with "unknown command" and writes no result file, which the guard in
          screenshot_gate turns into a loud error rather than a silent pass.
          Do not lower this below 5.45.0. The same version runs
          `doc-tools check-metadata` in metadata_check; a version without
          that subcommand skips it (a notice in the job log, nothing in the
          comment), and so does a run that finds no published taxonomy.yml,
          so it applies from the first release that ships it and from when
          the taxonomy is published.
        type: string
        default: '5.45.0'
      docs_app_id:
        description: >-
          DOCS_APP_ID — the redpanda-docs-automation GitHub App. Used only to
          mint a per-run, Contents:read token scoped to docs-team-standards
          for the plugin/scripts checkout: that repo is private and
          github.token cannot clone it from any other repo. Required in
          every caller except docs-team-standards itself.
        type: string
        default: ''
    secrets:
      aws_cred_account_id:
        description: RP_AWS_CRED_ACCOUNT_ID org secret (AWS account owning the OIDC role)
        required: true
      docs_app_private_key:
        description: DOCS_APP_PRIVATE_KEY — private key for docs_app_id (see above)
        required: false

env:
  REVIEW_STATUS_CONTEXT: docs-review

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # §2 — skip rules, scope, re-review baseline, exactly-once. Event-agnostic:
  # every event (opened, ready_for_review, synchronize, pull_request_review,
  # repository_dispatch) re-evaluates the same rules from the live API —
  # nothing is cached between runs except this pipeline's own report.
  # ──────────────────────────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      run_review: ${{ steps.scope.outputs.run_review }}
      head_sha: ${{ steps.eval.outputs.head_sha }}
      # full | incremental | approve_only (scripts/docs-review-scope.py)
      mode: ${{ steps.scope.outputs.decision }}
      baseline_sha: ${{ steps.scope.outputs.baseline_sha }}
      baseline_source: ${{ steps.scope.outputs.baseline_source }}
      ready_by: ${{ steps.scope.outputs.ready_by }}
      # On-request repos (review_trigger in the config): the request label to
      # remove when the run ends. Empty otherwise.
      request_label: ${{ steps.request.outputs.request_label }}
    steps:
      # The pin is checked first, without writing anything: the config that
      # says whether this repo reviews on request comes from plugin_ref.
      # The eval step below holds the PR pending when the pin is bad.
      - id: pin
        env:
          PLUGIN_REF: ${{ inputs.plugin_ref }}
        run: |
          if [[ "${PLUGIN_REF:-}" =~ ^[0-9a-f]{40}$ ]]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      # The scope rules and the scope script come from docs-team-standards
      # at plugin_ref, like the skills (private repo: see aggregate for the
      # token).
      - name: Mint a read-only token for the config checkout
        id: standards_token
        if: steps.pin.outputs.ok == 'true' && inputs.docs_app_id != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.docs_app_id }}
          private-key: ${{ secrets.docs_app_private_key }}
          owner: redpanda-data
          repositories: docs-team-standards
          permission-contents: read

      - uses: actions/checkout@v4
        if: steps.pin.outputs.ok == 'true'
        with:
          repository: redpanda-data/docs-team-standards
          ref: ${{ inputs.plugin_ref }}
          path: .standards
          token: ${{ steps.standards_token.outputs.token || github.token }}
          persist-credentials: false
          sparse-checkout: |
            .github/docs-review-config.json
            scripts/docs-review-scope.py
          sparse-checkout-cone-mode: false

      # review_trigger: is this repo reviewed only on request, and is this
      # event the request? A plugin_ref that predates the setting has no
      # --request mode; the repo is then reviewed automatically, as before.
      - id: request
        if: steps.pin.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail
          gh api "repos/$R/pulls/$PR" > "$RUNNER_TEMP/pr.json"
          CFG=.standards/.github/docs-review-config.json
          if [[ -f "$CFG" ]] && grep -q -- '--request' .standards/scripts/docs-review-scope.py 2>/dev/null; then
            python3 -I .standards/scripts/docs-review-scope.py --request "$CFG" "$RUNNER_TEMP/pr.json"
          fi

      - id: eval
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
          ON_REQUEST: ${{ steps.request.outputs.on_request }}
          IS_REQUEST: ${{ steps.request.outputs.is_request }}
          BOT_PR_POLICY: ${{ inputs.bot_pr_policy }}
          BOT_LOGINS: ${{ inputs.bot_logins }}
          SKIP_BRANCHES: ${{ inputs.skip_branch_patterns }}
          SKIP_TITLES: ${{ inputs.skip_title_patterns }}
        run: |
          set -euo pipefail

          if [[ -s "$RUNNER_TEMP/pr.json" ]]; then
            PRJ=$(cat "$RUNNER_TEMP/pr.json")
          else
            PRJ=$(gh api "repos/$R/pulls/$PR")
            printf '%s' "$PRJ" > "$RUNNER_TEMP/pr.json"
          fi
          HEAD_SHA=$(jq -r .head.sha <<< "$PRJ")
          AUTHOR=$(jq -r .user.login <<< "$PRJ")
          AUTHOR_TYPE=$(jq -r .user.type <<< "$PRJ")     # "User" | "Bot" (GitHub Apps)
          IS_DRAFT=$(jq -r .draft <<< "$PRJ")
          TITLE=$(jq -r .title <<< "$PRJ")
          BRANCH=$(jq -r .head.ref <<< "$PRJ")
          HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<< "$PRJ")
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # skip: leave the PR untouched — no status, no comment, no label.
          skip() { echo "$1"; echo "proceed=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # ── Fork PRs are never reviewed ───────────────────────────────
          # Derived HERE, from the PR object above, rather than trusted from
          # the caller's `if`. A caller can only see head.repo on a
          # pull_request event: on repository_dispatch (the Slack scan's entry
          # point) github.event.pull_request does not exist, so a caller-side
          # `event_name == 'repository_dispatch' || head.repo.full_name ==
          # github.repository` short-circuits to true and admits fork PRs.
          # Running Claude over untrusted head content is the prompt-injection
          # and credential-exfil risk this pipeline exists to avoid, so the
          # check belongs where every event path passes through it.
          # An EMPTY head.repo means the fork was deleted: origin unknown, so
          # it is skipped too rather than treated as same-repo.
          if [[ "$HEAD_REPO" != "$R" ]]; then
            skip "PR #$PR is from a fork (${HEAD_REPO:-<deleted fork>}) — not reviewed. Fork PRs fall through to human review."
          fi

          # ── Drafts are never reviewed ──────────────────────────────────
          # Converting to "ready for review" fires ready_for_review, which
          # every caller listens for: that is the author's review-now button
          # and the biggest spend lever (no review per push while drafting).
          if [[ "$IS_DRAFT" == "true" ]]; then
            skip "PR #$PR is a draft — not reviewed. Mark it ready for review to request the automated review."
          fi

          # ── On-request repos (review_trigger in the config) ────────────
          # Only the request label (or marking the PR ready while it has the
          # label) starts a review. Every other event in such a repo, pushes
          # and reviews included, exits here with nothing written.
          if [[ "${ON_REQUEST:-}" == "true" && "${IS_REQUEST:-}" != "true" ]]; then
            skip "PR #$PR is in an on-request repo and this event is not a review request — not reviewed."
          fi

          # ── Bot-authored PRs ───────────────────────────────────────────
          IS_BOT=false
          if [[ "$AUTHOR_TYPE" == "Bot" ]] || [[ "$AUTHOR" == *"[bot]" ]]; then
            IS_BOT=true
          else
            IFS=',' read -ra BOTS <<< "${BOT_LOGINS:-}"
            for b in "${BOTS[@]}"; do
              [[ "${b// /}" == "$AUTHOR" ]] && IS_BOT=true
            done
          fi
          if [[ "$IS_BOT" == "true" && "$BOT_PR_POLICY" != "review" ]]; then
            skip "PR #$PR is bot-authored (@$AUTHOR) and bot_pr_policy=skip — not reviewed; run the deterministic checks by hand."
          fi

          # ── Caller exclusions (branch glob / title regex) ──────────────
          while IFS= read -r pat; do
            # Trim both ends: a trailing space in a multi-line input would
            # otherwise make a pattern that can never match. MIRROR: sme-nag.yml
            # trims the same way, so the gate and the nag skip the same PRs.
            pat="${pat#"${pat%%[![:space:]]*}"}"; pat="${pat%"${pat##*[![:space:]]}"}"
            [[ -z "$pat" ]] && continue
            # shellcheck disable=SC2053  # unquoted on purpose: glob match
            if [[ "$BRANCH" == $pat ]]; then
              skip "PR #$PR head branch '$BRANCH' matches skip_branch_patterns '$pat' — not reviewed by this pipeline."
            fi
          done <<< "${SKIP_BRANCHES:-}"
          while IFS= read -r pat; do
            pat="${pat#"${pat%%[![:space:]]*}"}"; pat="${pat%"${pat##*[![:space:]]}"}"
            [[ -z "$pat" ]] && continue
            if [[ "$TITLE" =~ $pat ]]; then
              skip "PR #$PR title matches skip_title_patterns '$pat' — not reviewed by this pipeline."
            fi
          done <<< "${SKIP_TITLES:-}"

          set_pending() {
            # Truncated to 139: GitHub rejects a status description over 140
            # characters with a 422, and under `set -e` that would abort the
            # gate entirely, leaving the PR with no review, no comment and no
            # status. aggregate-review.sh truncates its own description for
            # the same reason.
            gh api "repos/$R/statuses/$HEAD_SHA" \
              -f context="$REVIEW_STATUS_CONTEXT" -f state=pending \
              -f description="${1:0:139}" \
              -f target_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          }

          # ── Exactly-once per (PR, head SHA) ───────────────────────────
          # Checked before anything writes a status, so a later event (a
          # review submitted) after a completed review leaves the verdict alone.
          # This has to stay ABOVE the plugin_ref guard below: that guard
          # writes a pending status, and writing one over a head SHA that
          # already carries a completed verdict would both destroy the verdict
          # and re-arm exactly-once, so the same SHA could be reviewed, and
          # billed, a second time.
          DONE=$(gh api "repos/$R/commits/$HEAD_SHA/status" \
            --jq '[.statuses[] | select(.context=="'"$REVIEW_STATUS_CONTEXT"'")
                   | select(.state=="success" or .state=="failure")] | length')
          if [[ "$DONE" -gt 0 ]]; then
            echo "Review already completed for $HEAD_SHA — exiting (exactly-once)."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Config guard for the skills pin: an empty plugin_ref would make
          # every downstream checkout fall back to the default branch — an
          # unpinned review under a "pinned" rollout. Hold with an
          # informative pending status instead of a hard fail (the same
          # posture as every other infra failure in this pipeline: never a
          # red X for a broken environment).
          if [[ ! "${PLUGIN_REF:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::plugin_ref is not a full commit SHA ('${PLUGIN_REF:-}') — holding the gate (pending), skipping review"
            set_pending "Docs review pipeline misconfigured (plugin_ref is not pinned)"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      # Scope, baseline and ready-for-approval: scripts/docs-review-scope.py,
      # driven by .github/docs-review-config.json. skip and noop exit here
      # with nothing written to the PR.
      - id: scope
        if: steps.eval.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          HEAD_SHA: ${{ steps.eval.outputs.head_sha }}
          DOC_TEAM: ${{ vars.DOC_TEAM_LOGINS }}
        run: |
          set -euo pipefail
          set_pending() {
            # Truncated to 139: GitHub rejects a status description over 140
            # characters with a 422, and under `set -e` that would abort the
            # gate entirely, leaving the PR with no review, no comment and no
            # status. aggregate-review.sh truncates its own description for
            # the same reason.
            gh api "repos/$R/statuses/$HEAD_SHA" \
              -f context="$REVIEW_STATUS_CONTEXT" -f state=pending \
              -f description="${1:0:139}" \
              -f target_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          }

          CFG=.standards/.github/docs-review-config.json
          if [[ ! -f "$CFG" || ! -f .standards/scripts/docs-review-scope.py ]]; then
            echo "::warning::plugin_ref predates .github/docs-review-config.json — holding the gate (pending), skipping review"
            set_pending "Docs review pipeline misconfigured (plugin_ref has no docs-review-config.json)"
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IN="$RUNNER_TEMP/scope-in"; mkdir -p "$IN" review-scope
          cp "$RUNNER_TEMP/pr.json" "$IN/pr.json"
          # Files API, not `gh pr diff --name-only` (see classify). Reviews
          # and comments: pipe into `jq -s`, never `--paginate --jq`.
          gh api --paginate "repos/$R/pulls/$PR/files" --jq '.[].filename' > "$IN/files.txt"
          gh api --paginate "repos/$R/pulls/$PR/reviews" | jq -s '[.[][]]' > "$IN/reviews.json"
          gh api --paginate "repos/$R/issues/$PR/comments" | jq -s '[.[][]]' > "$IN/comments.json"
          python3 -I .standards/scripts/docs-review-scope.py "$CFG" "$IN" review-scope
          DECISION=$(grep '^decision=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [[ "$DECISION" != "full" && "$DECISION" != "incremental" && "$DECISION" != "approve_only" ]]; then
            # skip / noop: no status, no comment, no review, no label.
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Claim this head SHA before spending anything ──────────────
          # The exactly-once check above only sees success/failure, which
          # aggregate writes at the END of a run — so two events for the same
          # SHA that overlap (a review submitted plus a synchronize seconds
          # later) would both read DONE=0 and both
          # start the paid Claude jobs. The caller's `concurrency` group
          # (docs-review-<pr>, cancel-in-progress: false — REQUIRED in every
          # caller) serializes runs per PR and is the primary guard; this
          # claim is the belt to that braces for a caller that dropped it:
          # write a pending status naming this run, then read back the
          # latest docs-review status. Statuses are ordered, so two writers
          # whose claims land inside the 3-second window below cannot both
          # see their own on top. This narrows the race rather than closing
          # it: a writer that claims more than ~3 s after another has read
          # back can still proceed too, which is why the concurrency group
          # stays required. A claim
          # older than 90 minutes (a run that died before aggregate) is
          # stale and may be taken over.
          CLAIM="Review running (run ${GITHUB_RUN_ID})"
          latest_claim() {
            gh api "repos/$R/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context=="'"$REVIEW_STATUS_CONTEXT"'")] | first
                    | {description: (.description // ""), updated_at: (.updated_at // "")}'
          }
          CURRENT=$(latest_claim)
          DESC=$(jq -r .description <<< "$CURRENT")
          if [[ "$DESC" == "Review running (run "* && "$DESC" != "$CLAIM" ]]; then
            AGE=$(( $(date +%s) - $(date -d "$(jq -r .updated_at <<< "$CURRENT")" +%s) ))
            if (( AGE < 5400 )); then
              echo "Head $HEAD_SHA is already claimed: '$DESC' (${AGE}s ago) — exiting (exactly-once)."
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::stale claim '$DESC' (${AGE}s old) — taking over"
          fi
          set_pending "$CLAIM"
          sleep 3   # let a racing writer land before the read-back
          if [[ "$(latest_claim | jq -r .description)" != "$CLAIM" ]]; then
            echo "Lost the claim race for $HEAD_SHA to another run — exiting (exactly-once)."
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_review=true" >> "$GITHUB_OUTPUT"

      # The file list (the delta when incremental), the delta's diff and the
      # earlier blockers, for classify and every review job.
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.run_review == 'true'
        with:
          name: review-scope
          path: review-scope/
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────
  # §4 — content classification for skill routing.
  # ──────────────────────────────────────────────────────────────────────
  classify:
    needs: gate
    if: needs.gate.outputs.run_review == 'true' && needs.gate.outputs.mode != 'approve_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_adoc: ${{ steps.c.outputs.has_adoc }}
      only_json: ${{ steps.c.outputs.only_json }}
      overrides_json: ${{ steps.c.outputs.overrides_json }}
      code_heavy: ${{ steps.c.outputs.code_heavy }}
      has_images: ${{ steps.c.outputs.has_images }}
      best_fit: ${{ steps.c.outputs.best_fit }}
      json_review: ${{ steps.c.outputs.json_review }}
      large: ${{ steps.c.outputs.large }}
      review_minutes: ${{ steps.c.outputs.review_minutes }}
      ticket: ${{ steps.c.outputs.ticket }}
      # Incremental re-review: a routed review that raised merge-blockers
      # last time runs again even when the delta has none of its files, so
      # it can say whether they are fixed instead of carrying them over.
      recheck_adoc: ${{ steps.c.outputs.recheck_adoc }}
      recheck_code: ${{ steps.c.outputs.recheck_code }}
      recheck_best_fit: ${{ steps.c.outputs.recheck_best_fit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review-scope
          path: review-scope
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          MODE: ${{ needs.gate.outputs.mode }}
        run: |
          set -euo pipefail
          # The gate wrote the file list: the files changed since the
          # baseline review when incremental, every changed file otherwise.
          # It comes from the files API, not `gh pr diff --name-only`: the
          # diff endpoint refuses any PR with more than 300 changed files
          # (HTTP 406, e.g. rp-connect-docs#494). The files API pages to
          # 3,000 files; past that, say so instead of classifying on a
          # silently partial list.
          cp review-scope/files.txt files.txt
          LISTED=$(grep -c . files.txt || true)
          if [[ "$MODE" != "incremental" ]]; then
            CHANGED=$(gh api "repos/$R/pulls/$PR" --jq '.changed_files')
            if (( LISTED < CHANGED )); then
              echo "::warning::the files API listed $LISTED of $CHANGED changed files (it stops at 3,000); classifying on the partial list"
            fi
          fi
          TOTAL=$LISTED
          PRIOR=review-scope/prior-blockers.json
          [[ -f "$PRIOR" ]] || echo '[]' > "$PRIOR"
          prior_for() { jq --arg a "$1" '[.[] | select(.artifact == $a and .src == "model")] | length' "$PRIOR"; }
          {
            echo "recheck_adoc=$([[ $(prior_for adoc-review) -gt 0 ]] && echo true || echo false)"
            echo "recheck_code=$([[ $(prior_for code-review) -gt 0 ]] && echo true || echo false)"
            echo "recheck_best_fit=$([[ $(prior_for best-fit-review) -gt 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          ADOC=$(grep -cE '\.adoc$' files.txt || true)
          JSON=$(grep -cE '\.json$' files.txt || true)
          OVERRIDES=$(grep -ciE '(^|/)[^/]*overrides[^/]*\.json$' files.txt || true)
          IMG=$(grep -ciE '\.(png|svg|jpe?g|gif|webp)$' files.txt || true)   # -i: .PNG, .JPG
          CODE=$(grep -cE '\.(go|java|py|js|ts|jsx|tsx|sh|sql|proto|c|cc|cpp|rs)$' files.txt || true)
          # docs-team-standards plugin files. Only this repo has them; in a
          # content repo the count is always 0.
          PLUGIN=$(grep -cE '^(skills|agents|commands|hooks|resources)/' files.txt || true)
          if [[ "$MODE" == "incremental" ]]; then
            CHURN=$(grep -cE '^[+-][^+-]|^[+-]$' review-scope/delta.patch || true)
          else
            CHURN=$(gh api "repos/$R/pulls/$PR" --jq '.additions + .deletions')
          fi
          {
            echo "has_adoc=$([[ $ADOC -gt 0 ]] && echo true || echo false)"
            echo "only_json=$([[ $TOTAL -gt 0 && $JSON -eq $TOTAL ]] && echo true || echo false)"
            echo "overrides_json=$([[ $OVERRIDES -gt 0 ]] && echo true || echo false)"
            # JSON validation runs on a JSON-only PR, and on any PR that
            # changes an overrides file: a mixed PR (overrides plus a README
            # or a workflow) used to classify as neither and leave the
            # highest-traffic JSON in these repos unvalidated.
            # Only in content repos: here the overrides review does not run
            # (json_validation excludes this repo), and files such as
            # evaluations/suites/overrides-review.eval.json only look like
            # overrides files. Counting them would suppress best_fit with no
            # JSON review to replace it, so nothing would run at all.
            JSON_REVIEW=false
            if [[ $TOTAL -gt 0 && $JSON -eq $TOTAL ]]; then JSON_REVIEW=true; fi
            if [[ $OVERRIDES -gt 0 && "$R" != "redpanda-data/docs-team-standards" ]]; then JSON_REVIEW=true; fi
            echo "json_review=$JSON_REVIEW"
            # Code-heavy heuristic (decision 3): ≥3 code files AND more code
            # files than .adoc files. In the content repos what this catches
            # is EXAMPLE code shipped alongside a page (a lab, a quickstart's
            # client snippets), not the main content — the code pass is
            # additive to the prose review, never a substitute for it. In a
            # tooling caller (docs-team-standards) it is the repo's own
            # implementation; the code_review prompt tells the two apart.
            # .yml/.yaml are not counted, so a workflow-only PR (or a
            # quickstart's docker-compose file) never trips this. Tune with data.
            echo "code_heavy=$([[ $CODE -ge 3 && $CODE -gt $ADOC ]] && echo true || echo false)"
            echo "has_images=$([[ $IMG -gt 0 ]] && echo true || echo false)"
            # Best-fit: no routed branch applies (no .adoc, no images, no
            # JSON review, not code-heavy), e.g. a workflow, a README, or one
            # or two scripts. Instead of posting "no checks apply",
            # best_fit_review picks the review that suits the change. It also
            # runs whenever plugin files change, even alongside a routed
            # review: code_review does not apply skill-authoring, so a skill
            # edited next to three scripts would otherwise get no skill
            # review at all.
            BEST_FIT=false
            if [[ $TOTAL -gt 0 && $ADOC -eq 0 && $IMG -eq 0 && "$JSON_REVIEW" == "false" ]] \
               && ! [[ $CODE -ge 3 && $CODE -gt $ADOC ]]; then
              BEST_FIT=true
            fi
            [[ $PLUGIN -gt 0 ]] && BEST_FIT=true
            echo "best_fit=$BEST_FIT"
            # Large PRs (by churn or file count) get a longer model budget:
            # #2912's own 3,749-line review hit the 20-minute default and came
            # back unavailable. 35 minutes still fits the 45-minute job
            # timeout with the action's setup and plugin probe.
            LARGE=false
            if (( CHURN >= 1500 || TOTAL >= 40 )); then LARGE=true; fi
            echo "large=$LARGE"
            echo "review_minutes=$([[ $LARGE == true ]] && echo 35 || echo 20)"
          } >> "$GITHUB_OUTPUT"
          TICKET=$(gh pr view "$PR" --repo "$R" --json title,body,headRefName \
            --jq '[.title, .body // "", .headRefName] | join(" ")' \
            | grep -oE 'DOC-[0-9]+' | head -1 || true)
          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────
  # §4 — doc-tools check-metadata over the .adoc changes.
  # Deterministic, no model: the same taxonomy check the docs repos'
  # check-metadata workflow and the Antora build run. Its own job because
  # it checks out the PR head and runs npm next to it, and must not hold
  # id-token: write while it does: npm reads a project .npmrc from the
  # nearest directory with a package.json, so an edited .npmrc could pick
  # the registry npx installs doc-tools from, and whatever that served
  # could mint an OIDC token, assume the repo's AWS role and read the
  # long-lived ADP client secret (see json_validation_local). Nothing here
  # needs a credential. As defense in depth, npx also runs from
  # RUNNER_TEMP with --root pointing at the checkout, so the PR's npm
  # config is never in npm's lookup path, and without GH_TOKEN.
  # adoc_review adds the result to its verdict and findings; the review
  # prompt does not read it.
  # ──────────────────────────────────────────────────────────────────────
  metadata_check:
    needs: [gate, classify]
    # Runs whenever adoc_review does (recheck_adoc included): its errors join
    # that branch's verdict as check_blocking, which an incremental re-review
    # treats as recomputed, so it must actually have re-run.
    if: needs.classify.outputs.has_adoc == 'true' || needs.classify.outputs.recheck_adoc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    steps:
      # Full history with blobs fetched on demand: --changed diffs against
      # the merge base with the PR's base branch.
      - name: Check out the PR head for check-metadata
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          path: .metadata-check
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deterministic checks (doc-tools check-metadata)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          DOC_TOOLS_VERSION: ${{ inputs.doc_tools_version }}
          SRC: ${{ github.workspace }}/.metadata-check
        run: |
          set -uo pipefail
          OUT_DIR="$RUNNER_TEMP/metadata-check"; mkdir -p "$OUT_DIR"
          RESULT="$OUT_DIR/check-metadata.json"
          # state: ran (a result to report) | missing (this doc-tools has no
          # check-metadata, or there is no published taxonomy.yml yet:
          # skipped, nothing reported) | failed (it could not run: reported
          # as a check that did not run, never as a pass).
          fail() { echo failed > "$OUT_DIR/state"; printf '%s\n' "$1" > "$OUT_DIR/reason"; echo "::warning::check-metadata: $1"; exit 0; }
          BASE=$(gh api "repos/$R/pulls/$PR" --jq '.base.ref' 2> /dev/null) || BASE=""
          [[ -n "$BASE" ]] || fail "could not read the pull request's base branch"
          rc=0
          # From RUNNER_TEMP, never the checkout: npm takes its project config
          # from the nearest directory with a package.json, and the PR head
          # has one. --root points the tool at the checkout instead.
          ( cd "$RUNNER_TEMP" && env -u GH_TOKEN npx --yes --package "@redpanda-data/docs-extensions-and-macros@${DOC_TOOLS_VERSION}" \
              doc-tools check-metadata --root "$SRC" --changed "origin/$BASE" --suggest --format json --output "$RESULT" ) > /dev/null 2> "$OUT_DIR/stderr.txt" || rc=$?
          # Exit 1 is "errors found" only with a result file: an unknown
          # subcommand (a doc_tools_version from before check-metadata) also
          # exits 1, and writes none.
          if [[ ( $rc -eq 0 || $rc -eq 1 ) && -s "$RESULT" ]] && jq -e '(.findings | type) == "array"' "$RESULT" > /dev/null 2>&1; then
            echo ran > "$OUT_DIR/state"
            jq -r '"check-metadata: \(.pages) page(s) with taxonomy metadata, \(.summary.errors) error(s), \(.summary.warnings) warning(s)"' "$RESULT"
          elif grep -q "unknown command 'check-metadata'" "$OUT_DIR/stderr.txt"; then
            echo missing > "$OUT_DIR/state"
            echo "::notice::doc-tools ${DOC_TOOLS_VERSION} has no check-metadata subcommand; page metadata is not checked until doc_tools_version names a release that ships it"
          elif [[ $rc -eq 2 ]] && grep -q "^check-metadata: no taxonomy.yml found" "$OUT_DIR/stderr.txt"; then
            # Not found anywhere (the repo, $REDPANDA_DOCS_PATH, or a 404 from
            # docs.redpanda.com). Any other taxonomy problem, an invalid file
            # or a failed fetch, is a check that could not run.
            echo missing > "$OUT_DIR/state"
            echo "::notice::check-metadata found no taxonomy.yml; page metadata is not checked until the taxonomy is published at docs.redpanda.com"
          else
            fail "doc-tools check-metadata could not run (exit $rc): $(tr '\n' ' ' < "$OUT_DIR/stderr.txt" | head -c 300)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metadata-check
          path: ${{ runner.temp }}/metadata-check/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — /docs-team-standards:pr-review over the .adoc changes.
  # ──────────────────────────────────────────────────────────────────────
  adoc_review:
    needs: [gate, classify, metadata_check]
    # !cancelled(), not the implicit success(): a failed metadata_check must
    # not skip the review. The step that adds its result reports it as a
    # check that did not run.
    if: >-
      !cancelled() && needs.classify.result == 'success' &&
      (needs.classify.outputs.has_adoc == 'true' || needs.classify.outputs.recheck_adoc == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 45
    steps:
      # Incremental re-review inputs from the gate (the delta's diff and file
      # list, and the earlier blockers). Under RUNNER_TEMP: the claude-skill
      # action's checkout runs `git clean` on the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: review-scope
          path: ${{ runner.temp }}/review-scope
      - uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        id: claude
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          # Longer for large PRs (classify: large); see classify for why.
          timeout_minutes: ${{ needs.classify.outputs.review_minutes || '20' }}
          prompt: >
            /docs-team-standards:pr-review ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}
            HEADLESS MODE — you are running in CI with no human present.
            The PR's head is ALREADY checked out in the working directory:
            do not run `gh pr checkout` or any git command other than
            `git status` (they are refused here). Read files in place, use
            the Grep tool wherever pr-review says `git grep`, and use
            `gh pr diff` for the diff. On a PR with more than 300 changed
            files `gh pr diff` fails (HTTP 406): list the files with
            `gh api --paginate repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/files`
            instead, whose entries carry each file's patch.
            Do NOT post anything to GitHub; there is no approval step here,
            so the pr-review rule "never post without approval" means: never
            post. Where the pr-review flow would spawn the content-reviewer
            agent for prose feedback, do so. This repository's own CLAUDE.md
            files (in the working tree, taken from the base branch) carry
            rules that apply only to this repo: apply them alongside the
            plugin's skills, and where a repo-local rule is more specific
            than a plugin rule, the repo-local rule wins. If Jira is
            unreachable, note that in the findings instead of failing. Write human-readable
            findings to review-output/findings.md and a machine verdict to
            review-output/verdict.json with the exact schema
            {"verdict":"pass"|"fail","blocking":["..."],"suggestions":["..."]}
            where "fail" means at least one genuinely blocking violation of
            team standards.
            Also add to verdict.json "needs_human": a list of one-sentence
            items that need a person rather than a code change, such as an
            SME question the PR leaves unanswered, a product or policy
            decision, or a claim you could not check against the repository
            or its sources. Leave it empty when there are none, and do not
            repeat merge-blockers there.
            ${{ needs.gate.outputs.mode == 'incremental' && format('INCREMENTAL RE-REVIEW. This PR was already reviewed at commit {0} ({1}). Review ONLY what changed since then. The diff of those changes is in {2}/review-scope/delta.patch and the files it touches are listed in {2}/review-scope/files.txt: use them instead of `gh pr diff` or the files API, which show the whole PR. Read the changed files in the working tree for context, but report a merge-blocker or a suggestion only when these changes introduce it or expose it. Earlier merge-blockers: {2}/review-scope/prior-blockers.json lists the blockers this pipeline reported before; the entries whose artifact is "adoc-review" and whose src is "model" are yours. Check each against the CURRENT files in the working tree, and add to verdict.json a "prior" list with one object per such entry, holding its exact "text" from that file and a "status" of "resolved" or "open". Do not repeat an open earlier blocker in "blocking": the pipeline carries it over. An entry you leave out of "prior" is carried over as open.', needs.gate.outputs.baseline_sha, needs.gate.outputs.baseline_source, runner.temp) || '' }}
            ${{ needs.classify.outputs.large == 'true' && 'This is a large PR: review the riskiest files first, and if you run out of time or turns before covering every changed file, add one entry to a "not_reviewed" list in verdict.json naming the files you did not review, so the report does not read as complete and the PR is not approved on a partial review.' || '' }}
      # metadata_check's result. Under RUNNER_TEMP, not the workspace: the
      # claude-skill action's own checkout runs `git clean` there.
      # continue-on-error: a missing result is handled in the next step.
      - uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: metadata-check
          path: ${{ runner.temp }}/metadata-check
      # check-metadata into this branch: errors are blocking, warnings are
      # suggestions, and so are the --suggest taxonomy values (the top 10 by
      # score, all of them in findings.md), which never fail the branch. A
      # check that could not run is `not_run`, as is a
      # metadata_check job that left no result. Every finding is also listed
      # in findings.md, which the comment shows. A review that wrote no
      # verdict stays unavailable: the deterministic result alone is not the
      # review. Messages carry page attribute values, so their markdown is
      # escaped.
      - name: Add the check-metadata findings to the review
        if: always()
        env:
          METADATA_CHECK_RESULT: ${{ needs.metadata_check.result }}
        run: |
          set -uo pipefail
          DIR="$RUNNER_TEMP/metadata-check"
          STATE=$(cat "$DIR/state" 2> /dev/null || echo none)
          REASON=""
          if [[ "$STATE" == none && "${METADATA_CHECK_RESULT:-}" != skipped ]]; then
            STATE=failed
            REASON="the metadata_check job left no result (${METADATA_CHECK_RESULT:-unknown})"
          fi
          [[ "$STATE" == ran || "$STATE" == failed ]] || { echo "check-metadata: $STATE, nothing to add"; exit 0; }
          mkdir -p review-output
          V=review-output/verdict.json
          F=review-output/findings.md
          HAVE_VERDICT=false
          [[ -f "$V" ]] && jq -e 'type == "object"' "$V" > /dev/null 2>&1 && HAVE_VERDICT=true
          if [[ "$STATE" == failed ]]; then
            [[ -n "$REASON" ]] || REASON=$(cat "$DIR/reason" 2> /dev/null || echo "no reason recorded")
            if [[ "$HAVE_VERDICT" == true ]]; then
              jq --arg r "Page metadata (doc-tools check-metadata): $REASON" \
                '.not_run = (((.not_run // []) | if type == "array" then . else [.] end) + [$r])' "$V" > "$V.tmp" && mv "$V.tmp" "$V"
            fi
            exit 0
          fi
          cp "$DIR/check-metadata.json" review-output/check-metadata.json
          if [[ "$(jq '.findings | length' "$DIR/check-metadata.json")" -gt 0 ]]; then
            {
              echo
              echo "### Page metadata (doc-tools check-metadata)"
              echo
              jq -r 'def md: gsub("(?<c>[`\\[\\]<>\\\\])"; "\\\(.c)");
                .findings[] | "- \(.severity): `\(.file):\(.line)` \(.message | md)"' "$DIR/check-metadata.json"
            } >> "$F"
          fi
          # Suggestions (--suggest): taxonomy values a changed page's text
          # names at or above the default minimum score that its header does
          # not carry. Never blocking; a doc-tools without them adds none.
          if [[ "$(jq '(.suggest.suggestions // []) | length' "$DIR/check-metadata.json")" -gt 0 ]]; then
            {
              echo
              echo "### Suggested taxonomy values (doc-tools check-metadata --suggest)"
              echo
              jq -r 'def md: gsub("(?<c>[`\\[\\]<>\\\\])"; "\\\(.c)");
                .suggest.suggestions | sort_by(.file, -.score)[]
                | "- `\(.file):\(.line // 1)`\(if .uncategorized then " (no page-categories yet)" else "" end): \(.label | md) (`\(.conceptId)`) in `:\(.attribute):`, score \(.score): \(.reason | md)"' "$DIR/check-metadata.json"
            } >> "$F"
          fi
          if [[ "$HAVE_VERDICT" == true ]]; then
            jq --slurpfile m "$DIR/check-metadata.json" '
              def md: gsub("(?<c>[`\\[\\]<>\\\\])"; "\\\(.c)");
              def line: "page metadata: `\(.file):\(.line)` \(.message | md)";
              def list(k): ((.[k] // []) | if type == "array" then . else [.] end);
              ($m[0].findings | map(select(.severity == "error") | line)) as $errors
              | ($m[0].findings | map(select(.severity != "error") | line)) as $warnings
              | .blocking = (list("blocking") + $errors)
              # Deterministic: re-run on the whole PR every time, so an
              # incremental re-review never carries these over (see
              # aggregate-review.sh).
              | if ($errors | length) > 0 then .check_blocking = (list("check_blocking") + $errors) else . end
              | ((($m[0].suggest.suggestions // []) | sort_by(-.score)) as $s
                  | ($s[:10] | map("page metadata suggestion: `\(.file):\(.line // 1)` consider \(.label | md) (`\(.conceptId)`) in `:\(.attribute):`, score \(.score): \(.reason | md)"))
                    + (if ($s | length) > 10 then ["page metadata: \(($s | length) - 10) more suggestion(s) in check-metadata.json"] else [] end)) as $suggested
              | .suggestions = (list("suggestions") + $warnings + $suggested)
              | if ($errors | length) > 0 then .verdict = "fail" else . end
              ' "$V" > "$V.tmp" && mv "$V.tmp" "$V"
          fi
          jq -r '"check-metadata: added \(.summary.errors) error(s), \(.summary.warnings) warning(s), and \((.suggest.suggestions // []) | length) suggestion(s) to the review"' "$DIR/check-metadata.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoc-review
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — JSON-only PRs (decision 4). docs-team-standards: the PR #2902
  # deterministic validators. Content repos: plain jq validity on every
  # changed .json, plus headless overrides-review when any *overrides*.json
  # changed; the last step folds the jq result into that verdict.
  # ──────────────────────────────────────────────────────────────────────
  # docs-team-standards only. Its own job because it runs the PR head's
  # scripts (validate-manifests.py) and must not hold id-token: write while
  # it does: with it, an edited script could mint an OIDC token, assume the
  # repo's AWS role and read the long-lived ADP client secret. Nothing here
  # needs a credential. Uploads the same artifact name as json_validation;
  # exactly one of the two runs, and aggregate reads whichever did.
  json_validation_local:
    needs: [gate, classify]
    if: needs.classify.outputs.only_json == 'true' && github.repository == 'redpanda-data/docs-team-standards'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - name: Deterministic validation (docs-team-standards)
        run: |
          set -euo pipefail
          mkdir -p review-output
          FAILED=0
          python3 scripts/validate-manifests.py || FAILED=1
          # Same file set and flags as validate-skills.yml. A wrong glob here
          # used to skip silently and report a pass that validated nothing.
          if compgen -G "evaluations/suites/*.eval.json" > /dev/null; then
            npx --yes ajv-cli@5.0.0 validate -s evaluations/schema.json --all-errors \
              -d "evaluations/suites/*.eval.json" || FAILED=1
          fi
          if [[ "$FAILED" -eq 1 ]]; then
            jq -n '{verdict:"fail",blocking:["JSON validation failed (validate-manifests / eval schema) — see job log"],suggestions:[]} | .check_blocking = .blocking' > review-output/verdict.json
          else
            jq -n '{verdict:"pass",blocking:[],suggestions:[]}' > review-output/verdict.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-validation
          path: review-output/
          if-no-files-found: ignore

  json_validation:
    needs: [gate, classify]
    if: needs.classify.outputs.json_review == 'true' && github.repository != 'redpanda-data/docs-team-standards'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential (overrides review)
    # 45 like every job that takes review_minutes: setup plus a 35-minute
    # large-PR budget does not fit in 30, and a job killed by its own timeout
    # writes no verdict.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      # Incremental re-review inputs from the gate (the delta's diff and file
      # list, and the earlier blockers). Under RUNNER_TEMP: the claude-skill
      # action's checkout runs `git clean` on the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: review-scope
          path: ${{ runner.temp }}/review-scope

      # Runs on every content-repo JSON-only PR, including ones that also
      # change an overrides file, so an unrelated .json beside it is still
      # checked. Writes under RUNNER_TEMP, not review-output/: the
      # claude-skill action's checkout runs `git clean` on the workspace.
      - name: Basic JSON validity (content repos)
        if: github.repository != 'redpanda-data/docs-team-standards'
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ runner.temp }}/json-validity.json
        run: |
          set -euo pipefail
          BAD=()
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue   # deleted files
            jq -e . "$f" > /dev/null 2>&1 || BAD+=("$f")
          done < <(gh api --paginate "repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/files" --jq '.[].filename' | grep -E '\.json$')   # files API: see classify
          if [[ ${#BAD[@]} -gt 0 ]]; then
            printf '%s\n' "${BAD[@]}" | jq -R . | jq -s '{verdict:"fail",blocking:(map("Invalid JSON: " + .)),suggestions:[]}' > "$OUT"
          else
            jq -n '{verdict:"pass",blocking:[],suggestions:[]}' > "$OUT"
          fi

      - name: Overrides review (content repos, decision 4)
        if: github.repository != 'redpanda-data/docs-team-standards' && needs.classify.outputs.overrides_json == 'true'
        uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          # Longer for large PRs (classify: large); see classify for why.
          timeout_minutes: ${{ needs.classify.outputs.review_minutes || '20' }}
          prompt: >
            /docs-team-standards:overrides-review — review the overrides
            JSON changes in ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}.
            HEADLESS MODE: do NOT post anything to GitHub. Apply this
            repository's own CLAUDE.md rules (in the working tree, from the
            base branch) alongside the skill. Write findings to
            review-output/findings.md and review-output/verdict.json with schema
            {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...]}.
            Also add to verdict.json "needs_human": a list of one-sentence
            items that need a person rather than a code change, such as an
            SME question the PR leaves unanswered, a product or policy
            decision, or a claim you could not check against the repository
            or its sources. Leave it empty when there are none, and do not
            repeat merge-blockers there.
            ${{ needs.gate.outputs.mode == 'incremental' && format('INCREMENTAL RE-REVIEW. This PR was already reviewed at commit {0} ({1}). Review ONLY what changed since then. The diff of those changes is in {2}/review-scope/delta.patch and the files it touches are listed in {2}/review-scope/files.txt: use them instead of `gh pr diff` or the files API, which show the whole PR. Read the changed files in the working tree for context, but report a merge-blocker or a suggestion only when these changes introduce it or expose it. Earlier merge-blockers: {2}/review-scope/prior-blockers.json lists the blockers this pipeline reported before; the entries whose artifact is "json-validation" and whose src is "model" are yours. Check each against the CURRENT files in the working tree, and add to verdict.json a "prior" list with one object per such entry, holding its exact "text" from that file and a "status" of "resolved" or "open". Do not repeat an open earlier blocker in "blocking": the pipeline carries it over. An entry you leave out of "prior" is carried over as open.', needs.gate.outputs.baseline_sha, needs.gate.outputs.baseline_source, runner.temp) || '' }}
            ${{ needs.classify.outputs.large == 'true' && 'This is a large PR: review the riskiest files first, and if you run out of time or turns before covering every changed file, add one entry to a "not_reviewed" list in verdict.json naming the files you did not review, so the report does not read as complete and the PR is not approved on a partial review.' || '' }}

      # Fold the jq result into the job's single verdict.json. With no
      # overrides file it IS the verdict. With one, invalid JSON joins the
      # overrides verdict's blocking list. If the overrides review wrote no
      # verdict, a jq failure still fails the job and says the review is
      # missing; with no jq failure, verdict.json stays absent so the
      # aggregate reports "unavailable" instead of a pass.
      - name: Combine JSON verdicts (content repos)
        if: always() && github.repository != 'redpanda-data/docs-team-standards'
        env:
          JQ_VERDICT: ${{ runner.temp }}/json-validity.json
          OVERRIDES: ${{ needs.classify.outputs.overrides_json }}
        run: |
          set -euo pipefail
          mkdir -p review-output
          V=review-output/verdict.json
          if [[ ! -f "$JQ_VERDICT" ]]; then
            jq -n '{verdict:"fail",blocking:["JSON validity check did not run — see job log"],suggestions:[]}' > "$JQ_VERDICT"
          fi
          # check_blocking: the jq validity blockers, recomputed every run
          # (see the screenshot gate's merge step).
          if [[ "$OVERRIDES" != "true" ]]; then
            jq '.check_blocking = .blocking' "$JQ_VERDICT" > "$V"
          elif [[ -f "$V" ]] && jq -e 'type == "object"' "$V" > /dev/null 2>&1; then
            jq -s '.[0] as $o | .[1] as $j
              | $o + {blocking: ((($o.blocking // []) | if type == "array" then . else [.] end) + $j.blocking),
                      check_blocking: $j.blocking}
              | if (.blocking | length) > 0 then .verdict = "fail" else . end' "$V" "$JQ_VERDICT" > "$V.tmp"
            mv "$V.tmp" "$V"
          elif jq -e '.verdict == "fail"' "$JQ_VERDICT" > /dev/null; then
            jq '.blocking += ["Overrides review produced no verdict — human review required"]' "$JQ_VERDICT" > "$V"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-validation
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — code pass for code-example-heavy PRs (additive to adoc_review).
  # In content repos "code-heavy" means example code shipped with a page, so
  # this pass checks that the examples are correct — the prose review above
  # still owns the page itself. This pipeline also has at least one
  # tooling-repo caller (docs-team-standards, whose own scripts/workflows are
  # its "code"), so the prompt below asks Claude to tell the two cases apart
  # rather than assuming every caller is a content repo.
  #
  # The prompt spells the task out instead of invoking /code-review. That
  # command comes from the code-review plugin in the claude-plugins-official
  # marketplace, which installs under the Claude config dir, and this action
  # points CLAUDE_CONFIG_DIR at a fresh empty directory on purpose so nothing
  # on the runner can inject settings or hooks into a review. So the plugin
  # never loads, the slash command would degrade to literal prompt text, and
  # the job would stay green while reviewing without it. It is not a CLI
  # built-in and docs-team-standards does not ship it either.
  # ──────────────────────────────────────────────────────────────────────
  code_review:
    needs: [gate, classify]
    if: needs.classify.outputs.code_heavy == 'true' || needs.classify.outputs.recheck_code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 45
    steps:
      # Incremental re-review inputs from the gate (the delta's diff and file
      # list, and the earlier blockers). Under RUNNER_TEMP: the claude-skill
      # action's checkout runs `git clean` on the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: review-scope
          path: ${{ runner.temp }}/review-scope
      - uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          # Longer for large PRs (classify: large); see classify for why.
          timeout_minutes: ${{ needs.classify.outputs.review_minutes || '20' }}
          prompt: >
            Review the code changed by pull request
            ${{ inputs.pr_number }} in this repository. Read the diff with
            `gh pr diff` (on a PR with more than 300 changed files it fails
            with HTTP 406; use `gh api --paginate
            repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/files`,
            whose entries carry each file's patch). No git command other
            than `git status` is allowed; use Grep and Read. Then read the
            changed files in the working tree for
            the context the diff alone does not show. Report correctness bugs
            first: something that is wrong, breaks, or does not do what the
            surrounding prose or code says it does. Note obvious
            simplifications only where they are clearly worth it, and skip
            style preferences. For anything you report, give the file, the
            line, and the concrete circumstances under which it goes wrong,
            and say so plainly if you are unsure rather than padding the list.
            HEADLESS MODE: do NOT post comments or apply fixes. First decide
            whether the changed code files are documentation EXAMPLES that
            ship with a page (a lab, a quickstart snippet) or this
            repository's OWN implementation code (scripts, CI, tooling) —
            most callers of this review are content repos where changed code
            is examples, but not all are. If they are examples, judge them as
            a reader will copy them (correct, runnable, matching the prose).
            If they are this repo's own implementation, review them as
            regular code (correctness, not doc-example fidelity). Either way,
            apply this repository's own CLAUDE.md rules (in the working tree,
            from the base branch). Write findings to
            review-output/findings.md and review-output/verdict.json
            with schema {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...]}
            where "fail" means a confirmed correctness bug.
            Also add to verdict.json "needs_human": a list of one-sentence
            items that need a person rather than a code change, such as an
            SME question the PR leaves unanswered, a product or policy
            decision, or a claim you could not check against the repository
            or its sources. Leave it empty when there are none, and do not
            repeat merge-blockers there.
            ${{ needs.gate.outputs.mode == 'incremental' && format('INCREMENTAL RE-REVIEW. This PR was already reviewed at commit {0} ({1}). Review ONLY what changed since then. The diff of those changes is in {2}/review-scope/delta.patch and the files it touches are listed in {2}/review-scope/files.txt: use them instead of `gh pr diff` or the files API, which show the whole PR. Read the changed files in the working tree for context, but report a merge-blocker or a suggestion only when these changes introduce it or expose it. Earlier merge-blockers: {2}/review-scope/prior-blockers.json lists the blockers this pipeline reported before; the entries whose artifact is "code-review" and whose src is "model" are yours. Check each against the CURRENT files in the working tree, and add to verdict.json a "prior" list with one object per such entry, holding its exact "text" from that file and a "status" of "resolved" or "open". Do not repeat an open earlier blocker in "blocking": the pipeline carries it over. An entry you leave out of "prior" is carried over as open.', needs.gate.outputs.baseline_sha, needs.gate.outputs.baseline_source, runner.temp) || '' }}
            ${{ needs.classify.outputs.large == 'true' && 'This is a large PR: review the riskiest files first, and if you run out of time or turns before covering every changed file, add one entry to a "not_reviewed" list in verdict.json naming the files you did not review, so the report does not read as complete and the PR is not approved on a partial review.' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # Best-fit review for changes no routed branch covers (classify's
  # best_fit): a skill, agent, or command file, a workflow, a README, one or
  # two scripts. Claude reads the diff and applies the plugin skill that
  # suits it, so every reviewed PR gets a report instead of "no checks
  # apply". Same posture as code_review: the prompt spells out the code
  # pass rather than invoking /code-review, which never loads here (see
  # code_review). It runs no PR-head scripts, so it may hold id-token.
  # ──────────────────────────────────────────────────────────────────────
  best_fit_review:
    needs: [gate, classify]
    if: needs.classify.outputs.best_fit == 'true' || needs.classify.outputs.recheck_best_fit == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 45
    steps:
      # Incremental re-review inputs from the gate (the delta's diff and file
      # list, and the earlier blockers). Under RUNNER_TEMP: the claude-skill
      # action's checkout runs `git clean` on the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: review-scope
          path: ${{ runner.temp }}/review-scope
      - uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          # Longer for large PRs (classify: large); see classify for why.
          timeout_minutes: ${{ needs.classify.outputs.review_minutes || '20' }}
          prompt: >
            Review pull request ${{ inputs.pr_number }} in
            ${{ github.repository }}. None of this pipeline's routed reviews
            (AsciiDoc pages, images, JSON-only, code-heavy) applies to it, so
            your job is to pick the review that best suits what it changes
            and run it. Read the diff with `gh pr diff` and the PR body with
            `gh pr view`. On a PR with more than 300 changed files
            `gh pr diff` fails (HTTP 406): use `gh api --paginate
            repos/${{ github.repository }}/pulls/${{ inputs.pr_number }}/files`
            instead, whose entries carry each file's patch. No git command
            other than `git status` is allowed;
            use Grep and Read, and read the changed files in the working tree
            for context the diff does not show.
            Choose by what the files are, and load the matching
            docs-team-standards skill with the Skill tool before reviewing:
            a skill, agent, command, hook, or resource of the
            docs-team-standards plugin → skill-authoring (also check the
            change against any skill it edits or references, and that evals
            or manifests it should update were updated); a GitHub workflow,
            action, or script → review it as code (correctness bugs first:
            what breaks, under which inputs, at which line; skip style);
            product UI strings → ux-text; strings that generate reference
            docs (property descriptions, CLI help, metric help) →
            embedded-reference-strings; Antora config (antora.yml, nav.adoc,
            playbooks) → antora-conventions; Markdown documentation (README,
            CONTRIBUTING, guides) → the review skill's style and accuracy
            checks. A mixed PR may need more than one; apply each to its
            files. Verify factual claims against the repository rather than
            trusting the PR description.
            Apply this repository's own CLAUDE.md rules (in the working tree,
            from the base branch) alongside the skills.
            HEADLESS MODE: do NOT post anything to GitHub and do not apply
            fixes. Write the review report to review-output/findings.md in
            this structure: a one-line summary of what the PR does and which
            review(s) you applied; "Merge-blockers" (numbered, each with the
            file, the problem, and the fix; or "None"); "Suggestions"
            (numbered; or "None"); "What works well" (brief). Calibrate
            strictly: a merge-blocker is something broken, incorrect, or a
            violation of a hard team standard, never a style preference.
            Write review-output/verdict.json as
            {"verdict":"pass"|"fail","blocking":["..."],"suggestions":["..."],"review_type":"<the skill or review you applied, e.g. skill-authoring>"}
            where "fail" means at least one merge-blocker.
            Also add to verdict.json "needs_human": a list of one-sentence
            items that need a person rather than a code change, such as an
            SME question the PR leaves unanswered, a product or policy
            decision, or a claim you could not check against the repository
            or its sources. Leave it empty when there are none, and do not
            repeat merge-blockers there.
            ${{ needs.gate.outputs.mode == 'incremental' && format('INCREMENTAL RE-REVIEW. This PR was already reviewed at commit {0} ({1}). Review ONLY what changed since then. The diff of those changes is in {2}/review-scope/delta.patch and the files it touches are listed in {2}/review-scope/files.txt: use them instead of `gh pr diff` or the files API, which show the whole PR. Read the changed files in the working tree for context, but report a merge-blocker or a suggestion only when these changes introduce it or expose it. Earlier merge-blockers: {2}/review-scope/prior-blockers.json lists the blockers this pipeline reported before; the entries whose artifact is "best-fit-review" and whose src is "model" are yours. Check each against the CURRENT files in the working tree, and add to verdict.json a "prior" list with one object per such entry, holding its exact "text" from that file and a "status" of "resolved" or "open". Do not repeat an open earlier blocker in "blocking": the pipeline carries it over. An entry you leave out of "prior" is carried over as open.', needs.gate.outputs.baseline_sha, needs.gate.outputs.baseline_source, runner.temp) || '' }}
            ${{ needs.classify.outputs.large == 'true' && 'This is a large PR: review the riskiest files first, and if you run out of time or turns before covering every changed file, add one entry to a "not_reviewed" list in verdict.json naming the files you did not review, so the report does not read as complete and the PR is not approved on a partial review.' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: best-fit-review
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §5 — screenshot standards: deterministic lint + Claude vision pass.
  # The lint is `doc-tools lint-screenshots` from docs-extensions-and-macros
  # — the ONE implementation, promoted from cloud-docs' repo-local script,
  # that cloud-docs also runs on every PR and in its daily screenshot cron
  # — so no two jobs disagree about the same 100KB limit. It runs on any
  # .adoc or image change (alt text lives in the .adoc); the paid vision
  # pass runs only when an image file changed.
  # ──────────────────────────────────────────────────────────────────────
  screenshot_gate:
    needs: [gate, classify]
    if: needs.classify.outputs.has_images == 'true' || needs.classify.outputs.has_adoc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deterministic checks (doc-tools lint-screenshots)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          DOC_TOOLS_VERSION: ${{ inputs.doc_tools_version }}
        run: |
          set -euo pipefail
          # Everything lands under RUNNER_TEMP: the claude-skill action's
          # own checkout runs `git clean` in the workspace and would delete
          # anything written there before the merge step reads it.
          LINT_DIR="$RUNNER_TEMP/screenshot-lint"; mkdir -p "$LINT_DIR"
          OUT="$LINT_DIR/screenshot-lint.json"
          if [[ ! -d modules ]]; then
            # Not an Antora content repo (docs-site, docs-team-standards): the
            # lint cannot run. Not a failure (a red X on every image PR in a
            # docs-only repo), but not a clean pass either: `not_run` makes the
            # aggregate list this check under "Did not run" and count it in
            # the headline, instead of a bare ✅.
            jq -n '{verdict:"pass", blocking:[], suggestions:[], not_run:["Screenshot lint (doc-tools lint-screenshots): this repo has no root modules/ directory, so the size and alt-text checks did not run"]}' > "$OUT"
            exit 0
          fi
          gh api --paginate "repos/$R/pulls/$PR/files" --jq '.[].filename' > "$LINT_DIR/changed-files.txt"   # files API: see classify
          # --files: only pages changed in the PR plus pages that use a changed
          # image. A whole-repo scan would flag every pre-existing violation
          # in a repo that has never been linted (docs has dozens today).
          # Exit 1 means findings — the jq below turns them into the verdict.
          # Any other non-zero exit (usage error, npx failure) fails the step.
          npx --yes --package "@redpanda-data/docs-extensions-and-macros@${DOC_TOOLS_VERSION}" \
            doc-tools lint-screenshots --files "$LINT_DIR/changed-files.txt" \
            --format json --output "$LINT_DIR/result.json" > /dev/null || [[ $? -eq 1 ]]
          # An unrecognized `lint-screenshots` subcommand (doc_tools_version
          # pinned to a release that predates it) also exits 1, the same code
          # the line above tolerates for "findings present" — but it writes no
          # result.json. Tell the two apart before jq turns a missing file
          # into a cryptic crash.
          if [[ ! -s "$LINT_DIR/result.json" ]]; then
            echo "::error::doc-tools lint-screenshots produced no output at doc_tools_version=${DOC_TOOLS_VERSION} — the pin may predate this subcommand, or npx failed to install it"
            exit 1
          fi
          # `// []`: a result with no findings key is a clean lint, not a
          # jq crash that turns into a red gate. The verdict also fails on
          # any error-level finding, so it does not depend on .summary
          # being present.
          jq '
            def line: "\(.file)\(if .line then ":\(.line)" else "" end)\(if .image then " [\(.image)]" else "" end) \(.message)";
            (.summary.errors // 0) as $errors
            | (.findings // []) as $f
            | {
                blocking:    [$f[] | select(.severity == "error")   | line],
                suggestions: [$f[] | select(.severity == "warning") | line]
              }
            | .verdict = (if (.blocking | length) > 0 or $errors > 0 then "fail" else "pass" end)
            ' "$LINT_DIR/result.json" > "$OUT"
          jq -r '"screenshot-lint: verdict=\(.verdict), \(.blocking | length) blocking, \(.suggestions | length) suggestion(s)"' "$OUT"

      # Incremental re-review inputs from the gate (the delta's diff and file
      # list, and the earlier blockers). Under RUNNER_TEMP: the claude-skill
      # action's checkout runs `git clean` on the workspace.
      - uses: actions/download-artifact@v4
        with:
          name: review-scope
          path: ${{ runner.temp }}/review-scope
      - name: Claude vision pass
        if: needs.classify.outputs.has_images == 'true'
        uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          # Its own directory, not review-output: review-output/verdict.json
          # is the job's FINAL merged verdict, and the aggregate treats a
          # present verdict.json as "this branch ran". Writing the vision
          # verdict there made a soft-failed vision pass indistinguishable
          # from a clean one, because the merge below then filled that same
          # file with the deterministic lint's pass.
          output_dir: review-output/vision
          prompt: >
            Review every image file changed in PR #${{ inputs.pr_number }} of
            ${{ github.repository }} against the plugin's screenshot
            standard: read .docs-team-standards-plugin/resources/screenshot-standards.md
            first and apply its judgment rules (purpose test; sanitize-at-
            capture preferred, solid overlay only as the fallback for
            existing images; crop and annotation rules; alt text agreeing
            with prose). Do not repeat the deterministic size/alt-text
            checks — `doc-tools lint-screenshots` runs those separately. If
            that file is ABSENT, the plugin pin predates
            docs-team-standards#2929: write review-output/vision/findings.md
            saying so and write NO verdict.json, so this branch reports
            "automated review unavailable" instead of grading against rules
            it cannot read. Read each image file directly. Do NOT post to
            GitHub. Write
            review-output/vision/screenshots.json as
            [{"file":"...","checks":{...},"verdict":"pass"|"fail","notes":"..."}]
            and review-output/vision/verdict.json as
            {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...]}
            covering only the judgment checks.
            ${{ needs.gate.outputs.mode == 'incremental' && format('INCREMENTAL RE-REVIEW. This PR was already reviewed at commit {0} ({1}). Review ONLY what changed since then. The diff of those changes is in {2}/review-scope/delta.patch and the files it touches are listed in {2}/review-scope/files.txt: use them instead of `gh pr diff` or the files API, which show the whole PR. Read the changed files in the working tree for context, but report a merge-blocker or a suggestion only when these changes introduce it or expose it. Earlier merge-blockers: {2}/review-scope/prior-blockers.json lists the blockers this pipeline reported before; the entries whose artifact is "screenshot-gate" and whose src is "model" are yours. Check each against the CURRENT files in the working tree, and add to verdict.json a "prior" list with one object per such entry, holding its exact "text" from that file and a "status" of "resolved" or "open". Do not repeat an open earlier blocker in "blocking": the pipeline carries it over. An entry you leave out of "prior" is carried over as open.', needs.gate.outputs.baseline_sha, needs.gate.outputs.baseline_source, runner.temp) || '' }}

      - name: Merge deterministic + vision verdicts
        if: always()
        env:
          HAS_IMAGES: ${{ needs.classify.outputs.has_images }}
        run: |
          set -uo pipefail
          mkdir -p review-output
          LINT="$RUNNER_TEMP/screenshot-lint/screenshot-lint.json"
          VISION=review-output/vision/verdict.json
          FINAL=review-output/verdict.json
          # Keep the raw lint verdict in the artifact next to the merged one.
          [[ -f "$LINT" ]] && cp "$LINT" review-output/screenshot-lint.json
          # Three states, and the third is the one that used to be reported as
          # a clean pass. The aggregate reads a present verdict.json as "this
          # branch produced a verdict", so when a pass that was SUPPOSED to run
          # produced nothing, the only honest thing is to leave verdict.json
          # absent and let the aggregate say "automated review unavailable".
          if [[ ! -f "$LINT" ]]; then
            echo "::warning::no deterministic lint result — leaving no verdict so the aggregate reports this branch unavailable"
            exit 0
          fi
          # check_blocking marks the blockers a deterministic check found.
          # On an incremental re-review those are recomputed every run, so the
          # aggregate never carries them over; the vision pass's are carried
          # unless the pass reports them resolved (its "prior" list).
          if [[ "${HAS_IMAGES:-}" != "true" ]]; then
            # No image changed, so the vision pass was never meant to run and
            # the lint alone is the complete answer for this PR.
            jq '.check_blocking = (.blocking // [])' "$LINT" > "$FINAL"
            echo "no image changes: verdict is the deterministic lint alone"
            exit 0
          fi
          if [[ ! -f "$VISION" ]]; then
            echo "::warning::the vision pass produced no verdict (soft-failed) — leaving no merged verdict so the aggregate reports this branch unavailable rather than passing it on the lint alone"
            exit 0
          fi
          jq -s '{
            verdict: (if (.[0].verdict=="fail" or .[1].verdict=="fail") then "fail" else "pass" end),
            blocking: ((.[0].blocking // []) + (.[1].blocking // [])),
            check_blocking: (.[0].blocking // []),
            suggestions: ((.[0].suggestions // []) + (.[1].suggestions // [])),
            not_run: ((.[0].not_run // []) + (.[1].not_run // [])),
            not_reviewed: (.[1].not_reviewed // []),
            prior: (.[1].prior // [])
          }' "$LINT" "$VISION" > "$FINAL"
          echo "merged the deterministic lint with the vision verdict"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-gate
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — constrained doc-ticket delta pass (decision 10: stages 1–2 only).
  # ──────────────────────────────────────────────────────────────────────
  ticket_delta:
    needs: [gate, classify, adoc_review]
    # !cancelled(), not the implicit success(): a hard adoc_review failure
    # (job timeout, plugin-load assertion, CLAUDE.md fetch) must degrade
    # the delta (the prompt handles a missing findings.md), not skip it. A
    # skipped delta drops out of the report silently instead of showing
    # as unavailable. !cancelled() rather than always() so a cancelled run
    # does not start a paid job.
    # Full reviews only: the ticket delta compares the whole PR with the
    # ticket, so an incremental re-review (which looks at the new commits
    # alone) leaves it to the earlier run.
    if: >-
      !cancelled() && needs.classify.result == 'success' && needs.gate.outputs.mode == 'full' &&
      needs.classify.outputs.ticket != '' && needs.classify.outputs.has_adoc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 45
    steps:
      # Under RUNNER_TEMP, not the workspace: the claude-skill action's own
      # checkout runs `git clean` there and would delete the download before
      # the prompt reads it. continue-on-error: adoc_review uploads nothing
      # when the skill wrote no files (if-no-files-found: ignore), and a
      # missing prose-review artifact must degrade the delta, not skip it.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: adoc-review
          path: ${{ runner.temp }}/prior-review
      # No --add-dir needed for the prompt to read it: a bare `Read` in the
      # action's allowlist is not scoped to the workspace in -p mode
      # (verified on CLI 2.1.258, reading a file outside the cwd).
      - uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          # Longer for large PRs (classify: large); see classify for why.
          timeout_minutes: ${{ needs.classify.outputs.review_minutes || '20' }}
          prompt: >
            Run ONLY stages 1–2 of /docs-team-standards:doc-ticket for
            ${{ needs.classify.outputs.ticket }} (dedupe + research; NO plan,
            NO draft — approval checkpoints cannot be granted in CI). If Jira
            is unreachable from this runner, derive the ticket's requirements
            from any quoted description in the PR body and say so. Then
            compare the ticket's requirements against the pr-review findings
            in ${{ runner.temp }}/prior-review/findings.md and this PR's diff
            (if that file does not exist, the prose review produced no
            findings file — say so and compare against the diff alone). Do
            NOT post to GitHub. Write the delta report (requirements the PR misses; PR
            content the ticket doesn't cover) to review-output/ticket-delta.md
            and review-output/verdict.json as
            {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...],"ticket_source":"jira"|"pr-body"|"none"}
            where "fail" means the PR clearly misses a requirement the ticket
            states, and ticket_source says where you read the ticket's
            requirements: "jira" only if you read the ticket itself,
            "pr-body" if you used a description quoted in the PR body, and
            "none" if you could read neither.
            Also add to verdict.json "needs_human": a list of one-sentence
            items that need a person rather than a code change, such as an
            SME question the PR leaves unanswered, a product or policy
            decision, or a claim you could not check against the repository
            or its sources. Leave it empty when there are none, and do not
            repeat merge-blockers there.
            ${{ needs.classify.outputs.large == 'true' && 'This is a large PR: review the riskiest files first, and if you run out of time or turns before covering every changed file, add one entry to a "not_reviewed" list in verdict.json naming the files you did not review, so the report does not read as complete and the PR is not approved on a partial review.' || '' }}
      # This job has no Jira credential yet (DOCS_REVIEW_ROLLOUT.md, org
      # setup item 6), so unless the PR body quotes the ticket, the delta
      # had nothing to compare against and its "pass" means nothing. Mark
      # that as a check that did not run, so the comment cannot show a bare
      # ✅. A missing or unrecognised ticket_source counts as "none".
      - name: Flag an unread ticket
        if: always()
        env:
          TICKET: ${{ needs.classify.outputs.ticket }}
        run: |
          set -euo pipefail
          V=review-output/verdict.json
          [[ -f "$V" ]] && jq -e 'type == "object"' "$V" > /dev/null 2>&1 || exit 0
          if jq -e '.ticket_source == "jira" or .ticket_source == "pr-body"' "$V" > /dev/null; then
            exit 0
          fi
          jq --arg t "$TICKET" '.not_run = (((.not_run // []) | if type == "array" then . else [.] end)
              + ["Ticket delta: \($t) was never read. This job cannot reach Jira, and the PR body quotes no ticket description, so there was nothing to compare the PR against. Quote the ticket description in the PR body to enable this check."])' \
            "$V" > "$V.tmp" && mv "$V.tmp" "$V"
          echo "::warning::ticket_delta read no ticket requirements; marked as not run"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticket-delta
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §6 — one verdict, one upserted comment, final informational status.
  # ──────────────────────────────────────────────────────────────────────
  aggregate:
    needs: [gate, classify, adoc_review, json_validation_local, json_validation, code_review, best_fit_review, screenshot_gate, ticket_delta]
    if: always() && needs.gate.outputs.run_review == 'true' && needs.gate.outputs.mode != 'approve_only'
    runs-on: ubuntu-latest
    # 25, not 15: preview-links.sh now waits up to 10 minutes for the
    # Netlify deploy (observed docs-repo deploys land between 4m22s and
    # 5m09s — a 5-minute bound sat right on the boundary).
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      checks: read
    steps:
      # docs-team-standards is private: github.token cannot clone it from
      # any other repo, so the scripts checkout uses a per-run App token
      # scoped to that repo with Contents: read (same as the plugin checkout
      # inside claude-skill). Empty docs_app_id = the caller is
      # docs-team-standards itself and github.token suffices.
      - name: Mint a read-only token for the scripts checkout
        id: standards_token
        if: inputs.docs_app_id != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.docs_app_id }}
          private-key: ${{ secrets.docs_app_private_key }}
          owner: redpanda-data
          repositories: docs-team-standards
          permission-contents: read

      - uses: actions/checkout@v4
        with:
          repository: redpanda-data/docs-team-standards
          # Same pin as the skills plugin: scripts and skills version together.
          ref: ${{ inputs.plugin_ref }}
          path: .standards
          token: ${{ steps.standards_token.outputs.token || github.token }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: results
        continue-on-error: true

      - name: Build preview links
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          PREVIEW_PATH_PREFIX: ${{ vars.PREVIEW_PATH_PREFIX }}
        run: |
          bash .standards/scripts/preview-links.sh "$R" "$PR" preview-links.md || : > preview-links.md

      # Deterministic checks (scripts/pr-checks.py): the preview pages, the
      # PR itself (conflicts, placeholders, stale approvals, open threads)
      # and overlap with other open PRs. No model and no PR-head code. A
      # crash here must not hide the rest of the review, so it degrades to
      # "skipped" with a warning instead of counting as unavailable. A
      # plugin_ref that predates the script also skips.
      # docs and cloud-docs are private and pair up on single-sourced pages,
      # so the paired-PR check needs to read the other repo. Best effort: if
      # the App cannot mint this (not installed there, or lacking
      # pull_requests: read), pr-checks.py notes the skipped check instead.
      - name: Mint a read-only token for the companion repo
        id: companion_token
        if: >-
          inputs.docs_app_id != '' &&
          (github.repository == 'redpanda-data/docs' || github.repository == 'redpanda-data/cloud-docs')
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.docs_app_id }}
          private-key: ${{ secrets.docs_app_private_key }}
          owner: redpanda-data
          repositories: docs,cloud-docs
          permission-pull-requests: read

      - name: PR and preview checks
        id: prchecks
        env:
          GH_TOKEN: ${{ github.token }}
          COMPANION_TOKEN: ${{ steps.companion_token.outputs.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
        run: |
          if [[ ! -f .standards/scripts/pr-checks.py ]]; then
            echo "result=skipped" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if python3 -I .standards/scripts/pr-checks.py "$R" "$PR" preview-links.md results/pr-checks \
             && [[ -f results/pr-checks/verdict.json ]]; then
            echo "result=success" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::pr-checks.py failed; the report goes out without the PR and preview checks"
            echo "result=skipped" >> "$GITHUB_OUTPUT"
          fi

      # The previous report carries a hidden data block with its blockers.
      # aggregate-review.sh compares against it to say what is no longer
      # reported since the last head. Missing is fine: the first run, or a
      # report deleted because the review was unavailable.
      - name: Fetch the previous report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$R/issues/$PR/comments" \
            | jq -s -r '[.[][] | select(.body | contains("<!-- docs-review:comment -->"))] | first | .body // ""' \
            > prev-comment.md || : > prev-comment.md

      # The earlier blockers the gate handed to the reviews (incremental
      # only). Moved out of results/ so aggregate-review.sh does not read
      # the artifact as a review branch.
      - name: Earlier blockers
        run: |
          if [[ -f results/review-scope/prior-blockers.json ]]; then
            cp results/review-scope/prior-blockers.json prior-blockers.json
          else
            echo '[]' > prior-blockers.json
          fi
          rm -rf results/review-scope

      - name: Merge verdicts and build the comment
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          MODE: ${{ needs.gate.outputs.mode }}
          BASELINE_SHA: ${{ needs.gate.outputs.baseline_sha }}
          BASELINE_SOURCE: ${{ needs.gate.outputs.baseline_source }}
          PRIOR_BLOCKERS_FILE: prior-blockers.json
          CONFIG_FILE: .standards/.github/docs-review-config.json
          TICKET: ${{ needs.classify.outputs.ticket }}
          RESULT_CLASSIFY: ${{ needs.classify.result }}
          RESULT_ADOC: ${{ needs.adoc_review.result }}
          # Exactly one JSON job runs (docs-team-standards: _local).
          RESULT_JSON: ${{ needs.json_validation.result != 'skipped' && needs.json_validation.result || needs.json_validation_local.result }}
          RESULT_CODE: ${{ needs.code_review.result }}
          RESULT_BEST_FIT: ${{ needs.best_fit_review.result }}
          RESULT_SHOTS: ${{ needs.screenshot_gate.result }}
          RESULT_TICKET: ${{ needs.ticket_delta.result }}
          RESULT_PR_CHECKS: ${{ steps.prchecks.outputs.result }}
          PREV_COMMENT_FILE: prev-comment.md
        run: |
          set -uo pipefail
          # Guarded like the preview-links call above it. If the aggregator
          # cannot run (missing from a plugin_ref that predates it, or a bug
          # in the script), an unguarded failure skips the two steps below,
          # so the PR gets no comment, no terminal status, and keeps the
          # gate's pending claim until the 90-minute stale window expires.
          # Degrade to the pipeline's standard infra-failure posture instead:
          # no comment (there is no report to give), an error status, and
          # needs-human-review. `error`, not `failure`:
          # exactly-once treats failure as a finished review, so the SHA
          # could never be retried (see aggregate-review.sh).
          if ! bash .standards/scripts/aggregate-review.sh results comment.md; then
            echo "::warning::aggregate-review.sh could not run — no comment; error status and needs-human-review instead"
            {
              echo "state=error"
              echo "description=automated review unavailable, human review required"
              echo "labels=needs-human-review"
              echo "post_comment=false"
            } >> "$GITHUB_OUTPUT"
            : > comment.md
          fi

      # continue-on-error for the same reason the aggregator is guarded: a
      # failed upsert (a transient 5xx or a secondary rate limit) would skip
      # the status step below and leave the gate's pending claim in place
      # until the 90-minute stale window expires. The status step still
      # posts the verdict; the run shows the upsert's failure.
      # No report (the review was unavailable, or nothing ran): post
      # nothing, and delete an earlier report, which describes an older
      # commit and could read as a current "Ready to approve". The status
      # and the needs-human-review label carry the outcome instead.
      - name: Upsert the review comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          PR: ${{ inputs.pr_number }}
          POST_COMMENT: ${{ steps.verdict.outputs.post_comment }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('comment.md', 'utf8');
            const issue_number = Number(process.env.PR);
            const marker = '<!-- docs-review:comment -->';
            const post = process.env.POST_COMMENT !== 'false' && body.trim() !== '';
            // GitHub rejects issue comments over 65,536 characters; five
            // model-written findings files can exceed that even after the
            // aggregator's per-file cap.
            const MAX = 60000;
            if (body.length > MAX) {
              // Keep the hidden data block (it is the last line): the next
              // run's "since the last review" and the metrics script read it,
              // and a large PR is where the report is most likely to be cut.
              const m = body.match(/\n<!-- docs-review:data [A-Za-z0-9+\/=]+ -->\s*$/);
              const data = m ? m[0] : '';
              body = body.slice(0, MAX - data.length) + '\n\n…\n\n_Comment truncated — the full findings are in the workflow run artifacts._' + data;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (!post) {
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
              });
            }

      # With no comment there is nowhere else for the preview links to
      # appear, and a PR that needs a review by hand is when the reviewer
      # wants them most. The docs-review status links to this run, so its
      # summary is one click from the checks list.
      - name: Preview links in the run summary (no comment posted)
        if: steps.verdict.outputs.post_comment == 'false'
        run: |
          if [[ -s preview-links.md ]]; then
            { echo "### 🔍 Preview pages"; echo; cat preview-links.md; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply labels and set the final status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          LABELS: ${{ steps.verdict.outputs.labels }}
        run: |
          set -euo pipefail
          if [[ -n "${LABELS:-}" ]]; then
            # gh api, not `gh pr edit --add-label`: pr edit trips on the
            # Projects-classic GraphQL deprecation in some repos.
            IFS=',' read -ra LS <<< "$LABELS"
            for L in "${LS[@]}"; do
              gh api "repos/$R/issues/$PR/labels" -f "labels[]=$L" > /dev/null 2>&1 || \
                echo "::warning::could not add label '$L' to $R#$PR"
            done
          fi
          # Informational status (decision 7 corrected): docs-review is NOT
          # a required check; the docs-team approval is the physical gate.
          gh api "repos/$R/statuses/$HEAD_SHA" \
            -f context="$REVIEW_STATUS_CONTEXT" \
            -f state="$STATE" \
            -f description="${DESCRIPTION:0:139}" \
            -f target_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}" > /dev/null

      # Approve a PR that passed (aggregate-review.sh decides, from the
      # config's approval criteria; approval.md lists the non-blocking
      # suggestions). When a later review finds merge-blockers, dismiss this
      # pipeline's own earlier approval so it cannot be mistaken for a
      # current one. Only reviews by github-actions[bot] that carry the
      # marker are touched; a person's approval never is.
      # continue-on-error: approving needs the org or repo setting "Allow
      # GitHub Actions to create and approve pull requests". Without it
      # GitHub answers 422; the report and status above still stand.
      - name: Approve, or withdraw an earlier automatic approval
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          APPROVE: ${{ steps.verdict.outputs.approve }}
          STATE: ${{ steps.verdict.outputs.state }}
        run: |
          set -euo pipefail
          MARK='<!-- docs-review:approval -->'
          if [[ "$APPROVE" == "true" && -s approval.md ]]; then
            jq -n --rawfile body approval.md --arg sha "$HEAD_SHA" \
              '{event: "APPROVE", commit_id: $sha, body: $body}' > approve.json
            if ! gh api -X POST "repos/$R/pulls/$PR/reviews" --input approve.json > /dev/null; then
              echo "::warning::could not approve $R#$PR. Check that \"Allow GitHub Actions to create and approve pull requests\" is on for this repo (Settings > Actions > General)."
              exit 1
            fi
            echo "Approved $R#$PR at $HEAD_SHA"
          elif [[ "$STATE" == "failure" ]]; then
            gh api --paginate "repos/$R/pulls/$PR/reviews" \
              | jq -s -r --arg m "$MARK" '[.[][] | select(.state == "APPROVED" and .user.login == "github-actions[bot]"
                                                     and ((.body // "") | contains($m)))] | .[].id' \
              | while read -r id; do
                  gh api -X PUT "repos/$R/pulls/$PR/reviews/$id/dismissals" -f event=DISMISS \
                    -f message="Withdrawn: the docs review of ${HEAD_SHA:0:7} found merge-blockers. See the review comment." > /dev/null \
                    && echo "Dismissed the pipeline's earlier approval $id" \
                    || echo "::warning::could not dismiss the pipeline's earlier approval $id"
                done
          fi

  # ──────────────────────────────────────────────────────────────────────
  # Ready-for-approval shortcut: review feedback on the current head says the
  # PR is ready for approval (scripts/docs-review-scope.py; only the docs
  # team or this pipeline's own report count, never the PR author), so
  # approve without re-reviewing. No comment beyond the approval itself.
  # ──────────────────────────────────────────────────────────────────────
  approve_ready:
    needs: gate
    if: needs.gate.outputs.run_review == 'true' && needs.gate.outputs.mode == 'approve_only'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          READY_BY: ${{ needs.gate.outputs.ready_by }}
        run: |
          set -euo pipefail
          status() {
            gh api "repos/$R/statuses/$HEAD_SHA" -f context="$REVIEW_STATUS_CONTEXT" \
              -f state="$1" -f description="${2:0:139}" \
              -f target_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          }
          BODY=$(printf '%s\n%s' '<!-- docs-review:approval -->' \
            "Approved by the docs-review pipeline without a re-review: ${READY_BY} marked this PR ready for approval at \`${HEAD_SHA:0:7}\`, and nothing has changed since.")
          jq -n --arg body "$BODY" --arg sha "$HEAD_SHA" '{event: "APPROVE", commit_id: $sha, body: $body}' > approve.json
          if gh api -X POST "repos/$R/pulls/$PR/reviews" --input approve.json > /dev/null; then
            status success "docs review: approved (ready for approval per ${READY_BY})"
          else
            # error, not success: exactly-once ignores error, so the next
            # event retries the approval.
            echo "::warning::could not approve $R#$PR. Check that \"Allow GitHub Actions to create and approve pull requests\" is on for this repo (Settings > Actions > General)."
            status error "docs review: ready for approval, but the automatic approval failed"
          fi

  # ──────────────────────────────────────────────────────────────────────
  # On-request repos: remove the request label when the run ends, whatever
  # it decided (reviewed, approved, nothing new to review, or unavailable),
  # so the label always means "a review is wanted" and adding it again asks
  # for the next round. Not after a gate failure: the request still stands.
  # ──────────────────────────────────────────────────────────────────────
  clear_request:
    needs: [gate, aggregate, approve_ready]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.request_label != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          LABEL: ${{ needs.gate.outputs.request_label }}
        run: |
          ENC=$(jq -rn --arg l "$LABEL" '$l | @uri')
          gh api -X DELETE "repos/$R/issues/$PR/labels/$ENC" > /dev/null 2>&1 \
            && echo "Removed the '$LABEL' label from $R#$PR" \
            || echo "'$LABEL' was already gone from $R#$PR"
