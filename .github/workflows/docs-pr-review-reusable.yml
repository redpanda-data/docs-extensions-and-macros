# Reusable docs PR review pipeline. Called by the thin docs-review.yml
# caller in each of the nine docs repos (template: .github/docs-review-caller-template.yml).
#
# Two caller modes (the `sme_gate` input):
#   - SME-gated content repos (docs, cloud-docs, api-docs, adp-docs,
#     adp-cloud-docs, rp-connect-docs): the review waits for one SME approval.
#   - Docs-only repos (docs-site, docs-team-standards, docs-template): no page
#     is owned by an engineer, so there is no SME step — the review runs as
#     soon as the PR is ready for review; the docs-team approval is the only
#     review these repos require.
#
# What never gets reviewed here (gate exits without touching the PR):
#   - draft PRs — marking a PR "ready for review" is the review-now button
#   - bot-authored PRs (GitHub Apps, plus the `bot_logins` service accounts,
#     e.g. vbotbuildovich) unless the caller sets bot_pr_policy: review, in
#     which case they are reviewed WITHOUT an SME gate (api-docs auto PRs)
#   - PRs matching a caller's skip_branch_patterns / skip_title_patterns
#     (adp-docs' daily sync PRs, which have their own critic)
#   - fork PRs (derived in the gate from the PR object, not trusted
#     from the caller's `if`, which cannot see head.repo on a
#     repository_dispatch event)
# The `no-sme-needed` label bypasses the SME gate on any PR in an SME-gated
# repo, exactly as it already silences the daily nag.
#
# HOSTING: this is the CANONICAL copy (public host, next to the
# doc-strings review that runs the same host/skills split in production).
# Callers reference
#   redpanda-data/docs-extensions-and-macros/.github/workflows/docs-pr-review-reusable.yml@<SHA>
# The SKILLS stay in docs-team-standards and are read at runtime (pinned
# checkout inside the claude-skill action) — only the host lives here. The
# twin copy in docs-team-standards (PR #2912, DOC-2496) is the review and
# dogfood path; keep the two in sync until dogfooding moves here. Neither
# host publishes git tags (`git ls-remote --tags` is empty), so @v1 is an
# unresolvable ref: pin a commit SHA per caller.
#
# TWO-STEP PIN after this PR merges: the claude-skill `uses:` refs below
# say @main because an action cannot reference its own not-yet-existing
# SHA. Step 1: merge this PR (SHA-1). Step 2: a one-line follow-up commit
# replaces @main with SHA-1 in every claude-skill ref (SHA-2). Callers
# then pin @SHA-2 — from that point nothing in the pipeline floats.
#
# Design doc + decision record: https://claude.ai/code/artifact/36e1362f-11d3-4532-8fe1-a5191c8def9f
#
# Ordering contract: in an SME-gated repo the automated docs review never
# runs before one SME approval (SME = (requested ∪ reviewed) − docs team −
# author, recomputed from the API on every run — never cached). Everywhere
# it runs exactly once per (PR, head SHA), and it never merges anything.
# The only physical merge gate is the docs-team approval (CODEOWNERS).
#
# `docs-review` is a COMMIT STATUS, not a label: the workflow writes it on
# the PR's head SHA and it shows up in the PR's checks list. pending =
# holding (waiting for SME / review running), success/failure = the review's
# verdict. It is informational — nothing here blocks a merge. The labels the
# workflow applies (`needs-human-review`, `screenshot-standards`) and the one
# humans apply (`no-sme-needed`) are listed in .github/DOCS_REVIEW_ROLLOUT.md.
#
# Exactly-once = two layers: the caller's `concurrency` group serializes
# runs per PR (primary; every caller must keep it), and the gate CLAIMS the
# head SHA with a pending status naming its run id before any paid job
# starts (backstop for a caller that dropped the group). A completed
# success/failure status on the SHA ends the matter for good.
#
# Trust boundary: the PR head is untrusted. The claude-skill action strips
# project-level Claude config (.claude/, .mcp.json) from it, replaces every
# CLAUDE.md in the head with the BASE branch's copies (repo-local rules are
# honoured, but a PR cannot rewrite the rules it is reviewed against),
# strips `allowed-tools:` grants from the plugin's command frontmatter (in
# -p mode those grants widen the CLI allowlist — a bare `Bash` grant would
# void the sandbox), runs Claude with a read-only `gh` shim on PATH and no
# tree-mutating git verbs, never persists git credentials in any checkout,
# and refuses an unpinned plugin_ref. Repo-private skills are fetched with a
# per-run App token scoped to docs-team-standards with Contents: read.

name: docs-pr-review (reusable)

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      # ── ADP AI Gateway auth (docs-pr-review agent's service account) ───
      # No Anthropic API key anywhere: model auth is the gateway, which
      # gives per-account spend attribution on the ADP cost page. Seven of
      # the nine callers were granted the credential in devprod-infra #779;
      # adp-cloud-docs and docs-template need a follow-up.
      sme_gate:
        description: >-
          true (default): hold the review until one SME approves. false for
          docs-only repos (docs-site, docs-team-standards, docs-template):
          no engineer owns pages there, so the review runs as soon as the PR
          is ready for review and only the docs-team approval is required.
        type: boolean
        default: true
      bot_pr_policy:
        description: >-
          What to do with bot-authored PRs (GitHub App authors, plus the
          logins in bot_logins). "skip" (default): no review at all — the
          writers run the deterministic checks by hand. "review": run the
          automated review WITHOUT an SME gate (api-docs auto PRs).
        type: string
        default: 'skip'
      bot_logins:
        description: >-
          Comma-separated service-account logins that count as bots even
          though GitHub types them as User (vbotbuildovich opens the
          auto-docs / dependency-bump PRs across the docs repos).
        type: string
        default: 'vbotbuildovich'
      skip_branch_patterns:
        description: >-
          Newline-separated shell globs; a PR whose head branch matches any
          of them is never reviewed by this pipeline (e.g. claude/docs-updates-*
          in adp-docs, whose daily sync PRs already have a dedicated critic).
        type: string
        default: ''
      skip_title_patterns:
        description: >-
          Newline-separated extended regexes; a PR whose title matches any of
          them is never reviewed by this pipeline.
        type: string
        default: ''
      aws_region:
        description: RP_AWS_CRED_REGION org variable
        type: string
        required: true
      aws_role_name_prefix:
        description: RP_AWS_CRED_BASE_ROLE_NAME org variable (caller repo name is appended)
        type: string
        required: true
      use_adp_gateway:
        description: Present for shim symmetry with the doc-strings review; the gateway is the only auth path here.
        type: boolean
        default: true
      adp_client_secret_id:
        description: >-
          Secrets Manager id of the ADP OAuth client. The JSON key names
          inside derive from the secret's own last path segment
          (DOCS_PR_REVIEW_CLIENT_ID/_SECRET here, not ADP_PRIV_CLIENT_*),
          and the mint and scrub steps derive that prefix from this value
          rather than hardcoding it, so pointing this at another secret
          actually works. ATTRIBUTION: this is the docs-pr-review agent's own
          credential, which is what puts this review's spend on its own line
          on Cost and usage instead of inside doc-detective's
          (docs_team_agents_client is that agent's credential). Cost and usage
          attributes per agent and tags are per-agent and static, so sharing
          one secret between two workloads collapses their spend permanently.
          The secret is created and granted in devprod-infra#826; until that
          merges and the values are written, the fetch fails and every review
          degrades to "automated review unavailable".
        type: string
        default: 'sdlc/prod/github/docs_pr_review_client'
      plugin_ref:
        description: >-
          Commit SHA of redpanda-data/docs-team-standards checked out as the
          skills plugin at runtime. EVERY CALLER MUST PASS IT: there is no
          usable default, and the gate holds the PR pending (never a silent
          skill-less review) when it is not a full SHA. The dogfood caller
          passes its own PR head SHA; every other caller pins a verified SHA
          and bumps it deliberately — it is the rollback unit.
        type: string
        default: ''
      doc_tools_version:
        description: >-
          Published @redpanda-data/docs-extensions-and-macros version whose
          `doc-tools lint-screenshots` runs the deterministic screenshot
          checks — the same command cloud-docs runs on every PR and in its
          daily screenshot cron. Exact version, never a range or a tag.
          5.45.0 is the release that first ships that subcommand (#313). Every
          earlier version, including the 5.38.0 this used to name, exits 1
          with "unknown command" and writes no result file, which the guard in
          screenshot_gate turns into a loud error rather than a silent pass.
          Do not lower this below 5.45.0.
        type: string
        default: '5.45.0'
      docs_app_id:
        description: >-
          DOCS_APP_ID — the redpanda-docs-automation GitHub App. Used only to
          mint a per-run, Contents:read token scoped to docs-team-standards
          for the plugin/scripts checkout: that repo is private and
          github.token cannot clone it from any other repo. Required in
          every caller except docs-team-standards itself.
        type: string
        default: ''
    secrets:
      aws_cred_account_id:
        description: RP_AWS_CRED_ACCOUNT_ID org secret (AWS account owning the OIDC role)
        required: true
      docs_app_private_key:
        description: DOCS_APP_PRIVATE_KEY — private key for docs_app_id (see above)
        required: false

env:
  REVIEW_STATUS_CONTEXT: docs-review

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # §2 — skip rules, SME gating, exactly-once. Event-agnostic: every event
  # (opened, ready_for_review, synchronize, review_requested, labeled,
  # pull_request_review, repository_dispatch) re-evaluates the same rules
  # from the live API — nothing is cached between runs.
  # ──────────────────────────────────────────────────────────────────────
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      run_review: ${{ steps.eval.outputs.run_review }}
      head_sha: ${{ steps.eval.outputs.head_sha }}
      sme_approver: ${{ steps.eval.outputs.sme_approver }}
      sme_set: ${{ steps.eval.outputs.sme_set }}
      # How the SME requirement was satisfied — the review comment says so:
      # approved | repo-not-gated | no-sme-needed-label | bot-author
      sme_mode: ${{ steps.eval.outputs.sme_mode }}
    steps:
      - id: eval
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DOC_TEAM: ${{ vars.DOC_TEAM_LOGINS }}
          PLUGIN_REF: ${{ inputs.plugin_ref }}
          SME_GATE: ${{ inputs.sme_gate }}
          BOT_PR_POLICY: ${{ inputs.bot_pr_policy }}
          BOT_LOGINS: ${{ inputs.bot_logins }}
          SKIP_BRANCHES: ${{ inputs.skip_branch_patterns }}
          SKIP_TITLES: ${{ inputs.skip_title_patterns }}
        run: |
          set -euo pipefail

          PRJ=$(gh api "repos/$R/pulls/$PR")
          HEAD_SHA=$(jq -r .head.sha <<< "$PRJ")
          AUTHOR=$(jq -r .user.login <<< "$PRJ")
          AUTHOR_TYPE=$(jq -r .user.type <<< "$PRJ")     # "User" | "Bot" (GitHub Apps)
          IS_DRAFT=$(jq -r .draft <<< "$PRJ")
          TITLE=$(jq -r .title <<< "$PRJ")
          BRANCH=$(jq -r .head.ref <<< "$PRJ")
          HEAD_REPO=$(jq -r '.head.repo.full_name // ""' <<< "$PRJ")
          LABELS=$(jq -r '[.labels[].name] | join(",")' <<< "$PRJ")
          {
            echo "head_sha=$HEAD_SHA"
            echo "sme_set="
            echo "sme_approver="
            echo "sme_mode="
          } >> "$GITHUB_OUTPUT"

          # skip: leave the PR untouched — no status, no comment, no label.
          skip() { echo "$1"; echo "run_review=false" >> "$GITHUB_OUTPUT"; exit 0; }

          # ── Fork PRs are never reviewed ───────────────────────────────
          # Derived HERE, from the PR object above, rather than trusted from
          # the caller's `if`. A caller can only see head.repo on a
          # pull_request event: on repository_dispatch (the Slack scan's entry
          # point) github.event.pull_request does not exist, so a caller-side
          # `event_name == 'repository_dispatch' || head.repo.full_name ==
          # github.repository` short-circuits to true and admits fork PRs.
          # Running Claude over untrusted head content is the prompt-injection
          # and credential-exfil risk this pipeline exists to avoid, so the
          # check belongs where every event path passes through it.
          # An EMPTY head.repo means the fork was deleted: origin unknown, so
          # it is skipped too rather than treated as same-repo.
          if [[ "$HEAD_REPO" != "$R" ]]; then
            skip "PR #$PR is from a fork (${HEAD_REPO:-<deleted fork>}) — not reviewed. Fork PRs fall through to human review."
          fi

          # ── Drafts are never reviewed ──────────────────────────────────
          # Converting to "ready for review" fires ready_for_review, which
          # every caller listens for: that is the author's review-now button
          # and the biggest spend lever (no review per push while drafting).
          if [[ "$IS_DRAFT" == "true" ]]; then
            skip "PR #$PR is a draft — not reviewed. Mark it ready for review to request the automated review."
          fi

          # ── Bot-authored PRs ───────────────────────────────────────────
          IS_BOT=false
          if [[ "$AUTHOR_TYPE" == "Bot" ]] || [[ "$AUTHOR" == *"[bot]" ]]; then
            IS_BOT=true
          else
            IFS=',' read -ra BOTS <<< "${BOT_LOGINS:-}"
            for b in "${BOTS[@]}"; do
              [[ "${b// /}" == "$AUTHOR" ]] && IS_BOT=true
            done
          fi
          if [[ "$IS_BOT" == "true" && "$BOT_PR_POLICY" != "review" ]]; then
            skip "PR #$PR is bot-authored (@$AUTHOR) and bot_pr_policy=skip — not reviewed; run the deterministic checks by hand."
          fi

          # ── Caller exclusions (branch glob / title regex) ──────────────
          while IFS= read -r pat; do
            pat="${pat#"${pat%%[![:space:]]*}"}"; [[ -z "$pat" ]] && continue
            # shellcheck disable=SC2053  # unquoted on purpose: glob match
            if [[ "$BRANCH" == $pat ]]; then
              skip "PR #$PR head branch '$BRANCH' matches skip_branch_patterns '$pat' — not reviewed by this pipeline."
            fi
          done <<< "${SKIP_BRANCHES:-}"
          while IFS= read -r pat; do
            pat="${pat#"${pat%%[![:space:]]*}"}"; [[ -z "$pat" ]] && continue
            if [[ "$TITLE" =~ $pat ]]; then
              skip "PR #$PR title matches skip_title_patterns '$pat' — not reviewed by this pipeline."
            fi
          done <<< "${SKIP_TITLES:-}"

          # Helpers ---------------------------------------------------------
          derive_smes() {
            # MIRROR: .github/workflows/sme-nag.yml derives the same set from
            # `gh pr list --json reviewRequests,latestReviews` (a different API
            # shape, so the code cannot be shared verbatim). The RULE must stay
            # identical — (requested ∪ reviewed) − docs team − author − bots —
            # or the nag will chase authors the gate is already satisfied
            # with, or vice versa. Change both together.
            #
            # (requested ∪ reviewed) − docs team − author − bots, recomputed
            # from the API on EVERY run. Deliberately not cached anywhere: a
            # marker comment would be shared mutable state that anyone with
            # write access can edit or delete, and a stale snapshot silently
            # changes gate behaviour. requested_reviewers alone is DESTRUCTIVE
            # (GitHub drops a user the moment they submit any review), which
            # is why the union with users-who-reviewed is what makes this
            # recomputable at any moment.
            local live reviewed
            live=$(gh api "repos/$R/pulls/$PR" --jq '[.requested_reviewers[].login] | join(",")')
            # Pipe into `jq -s`, never `--paginate --jq`: gh applies --jq to
            # each 30-item page separately and prints one line per page, so
            # a PR with >30 reviews yields "a,b\nc,d" and a bogus login
            # "b\nc" after split(",") — real SMEs silently dropped. (gh's
            # own --slurp cannot be combined with --jq.)
            reviewed=$(gh api "repos/$R/pulls/$PR/reviews" --paginate \
              | jq -rs '[.[][].user.login] | unique | join(",")')
            jq -nr --arg live "$live" --arg reviewed "$reviewed" \
              --arg team "$DOC_TEAM" --arg author "$AUTHOR" --arg bots "$BOT_LOGINS" '
              (($live | split(",")) + ($reviewed | split(","))) | unique
              | map(select(. != "" and . != $author))
              | map(select(endswith("[bot]") | not))
              | map(select(. as $l | ($bots | split(",") | map(gsub("\\s";""))) | index($l) | not))
              | map(select(. as $l | ($team | split(",") | map(gsub("\\s";""))) | index($l) | not))
              | join(",")'
          }
          set_pending() {
            # Truncated to 139: GitHub rejects a status description over 140
            # characters with a 422, and under `set -e` that would abort the
            # gate entirely, leaving the PR with no review, no comment and no
            # status. The SME-list caller below is unbounded (one login per
            # tagged reviewer), and aggregate-review.sh truncates its own
            # description for the same reason.
            gh api "repos/$R/statuses/$HEAD_SHA" \
              -f context="$REVIEW_STATUS_CONTEXT" -f state=pending \
              -f description="${1:0:139}" \
              -f target_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
          }

          # ── Exactly-once per (PR, head SHA) ───────────────────────────
          # Checked before anything writes a status, so a review_requested or
          # labeled event after a completed review leaves the verdict alone.
          # This has to stay ABOVE the plugin_ref guard below: that guard
          # writes a pending status, and writing one over a head SHA that
          # already carries a completed verdict would both destroy the verdict
          # and re-arm exactly-once, so the same SHA could be reviewed, and
          # billed, a second time.
          DONE=$(gh api "repos/$R/commits/$HEAD_SHA/status" \
            --jq '[.statuses[] | select(.context=="'"$REVIEW_STATUS_CONTEXT"'")
                   | select(.state=="success" or .state=="failure")] | length')
          if [[ "$DONE" -gt 0 ]]; then
            echo "Review already completed for $HEAD_SHA — exiting (exactly-once)."
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Config guard for the skills pin: an empty plugin_ref would make
          # every downstream checkout fall back to the default branch — an
          # unpinned review under a "pinned" rollout. Hold with an
          # informative pending status instead of a hard fail (the same
          # posture as every other infra failure in this pipeline: never a
          # red X for a broken environment).
          if [[ ! "${PLUGIN_REF:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::plugin_ref is not a full commit SHA ('${PLUGIN_REF:-}') — holding the gate (pending), skipping review"
            set_pending "Docs review pipeline misconfigured (plugin_ref is not pinned)"
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── Does this PR need an SME approval first? ──────────────────
          SME_MODE=approved
          if [[ "$SME_GATE" != "true" ]]; then
            SME_MODE=repo-not-gated          # docs-only repo: no engineer-owned pages
          elif [[ ",$LABELS," == *",no-sme-needed,"* ]]; then
            SME_MODE=no-sme-needed-label     # same escape hatch the daily nag honours
          elif [[ ",$LABELS," == *",author-is-sme,"* ]]; then
            # Engineer-authored PR (e.g. adp-docs-author): the author IS the
            # SME, and derive_smes subtracts the author, so the set would be
            # empty forever. Same effect as no-sme-needed; a label the
            # engineer reads should describe their situation.
            SME_MODE=author-is-sme-label
          elif [[ "$IS_BOT" == "true" ]]; then
            SME_MODE=bot-author              # bot_pr_policy=review: auto PRs get no SME review
          fi

          if [[ "$SME_MODE" == "approved" ]]; then
            # A missing DOC_TEAM_LOGINS is environment misconfiguration, not
            # a review verdict — hold with an informative pending status.
            # See .github/DOCS_REVIEW_ROLLOUT.md org-setup for the variable.
            if [[ -z "${DOC_TEAM:-}" ]]; then
              echo "::warning::DOC_TEAM_LOGINS org variable is not set — holding the SME gate (pending), skipping review"
              set_pending "Waiting for SME approval (DOC_TEAM_LOGINS is not configured)"
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # ── Evaluate the SME gate (event-agnostic, stateless) ───────
            SMES=$(derive_smes)
            echo "sme_set=$SMES" >> "$GITHUB_OUTPUT"

            if [[ -z "$SMES" ]]; then
              set_pending "Waiting for SME approval (no SME tagged — daily nag active; or label no-sme-needed / author-is-sme)"
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            # Latest non-COMMENTED review state per SME, by submitted_at.
            # `jq -s` + [.[][]] flattens the pages into ONE array; per-page
            # `--jq` output would make PASS a multi-line string that never
            # equals "true", holding the gate forever on PRs with >30 reviews.
            gh api "repos/$R/pulls/$PR/reviews" --paginate \
              | jq -s '[.[][] | select(.state != "COMMENTED")]
                    | group_by(.user.login)
                    | map(max_by(.submitted_at))
                    | map({login: .user.login, state})' > states.json

            # Decision 2 (corrected): ONE SME approval opens the gate, but any
            # other SME's outstanding CHANGES_REQUESTED vetoes it until that
            # SME approves or their review is dismissed (either fires a
            # pull_request_review event, re-evaluating here). The gate does
            # NOT assume dismiss-stale-approvals: enabling it changes merge
            # behaviour for every human contributor across the docs repos and
            # is its own decision, outside this project. With it ON, APPROVED
            # always refers to current code; with it OFF, an earlier SME
            # approval persists across pushes — the review still runs at most
            # once per head SHA either way, and the status stays informational.
            PASS=$(jq -r --arg smes "$SMES" '
              ($smes | split(",")) as $set
              | [ .[] | select(.login as $l | $set | index($l)) ] as $sme
              | if ($sme | map(select(.state=="CHANGES_REQUESTED")) | length) > 0
                then "false"
                elif ($sme | map(select(.state=="APPROVED")) | length) > 0
                then "true"
                else "false"
                end' states.json)

            APPROVER=$(jq -r --arg smes "$SMES" '
              ($smes | split(",")) as $set
              | [ .[] | select(.login as $l | $set | index($l)) | select(.state=="APPROVED") | .login ]
              | join(", ")' states.json)
            echo "sme_approver=$APPROVER" >> "$GITHUB_OUTPUT"

            if [[ "$PASS" != "true" ]]; then
              set_pending "Waiting for SME approval (${SMES})"
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "SME gate not required for PR #$PR ($SME_MODE) — proceeding to review."
          fi
          echo "sme_mode=$SME_MODE" >> "$GITHUB_OUTPUT"

          # ── Claim this head SHA before spending anything ──────────────
          # The exactly-once check above only sees success/failure, which
          # aggregate writes at the END of a run — so two events for the same
          # SHA that overlap (an SME approval plus a synchronize seconds
          # later, or two SME approvals) would both read DONE=0 and both
          # start the paid Claude jobs. The caller's `concurrency` group
          # (docs-review-<pr>, cancel-in-progress: false — REQUIRED in every
          # caller) serializes runs per PR and is the primary guard; this
          # claim is the belt to that braces for a caller that dropped it:
          # write a pending status naming this run, then read back the
          # latest docs-review status — statuses are ordered, so of two
          # racing writers exactly one sees its own claim on top. A claim
          # older than 90 minutes (a run that died before aggregate) is
          # stale and may be taken over.
          CLAIM="Review running (run ${GITHUB_RUN_ID})"
          latest_claim() {
            gh api "repos/$R/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context=="'"$REVIEW_STATUS_CONTEXT"'")] | first
                    | {description: (.description // ""), updated_at: (.updated_at // "")}'
          }
          CURRENT=$(latest_claim)
          DESC=$(jq -r .description <<< "$CURRENT")
          if [[ "$DESC" == "Review running (run "* && "$DESC" != "$CLAIM" ]]; then
            AGE=$(( $(date +%s) - $(date -d "$(jq -r .updated_at <<< "$CURRENT")" +%s) ))
            if (( AGE < 5400 )); then
              echo "Head $HEAD_SHA is already claimed: '$DESC' (${AGE}s ago) — exiting (exactly-once)."
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::stale claim '$DESC' (${AGE}s old) — taking over"
          fi
          set_pending "$CLAIM"
          sleep 3   # let a racing writer land before the read-back
          if [[ "$(latest_claim | jq -r .description)" != "$CLAIM" ]]; then
            echo "Lost the claim race for $HEAD_SHA to another run — exiting (exactly-once)."
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_review=true" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────
  # §4 — content classification for skill routing.
  # ──────────────────────────────────────────────────────────────────────
  classify:
    needs: gate
    if: needs.gate.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_adoc: ${{ steps.c.outputs.has_adoc }}
      only_json: ${{ steps.c.outputs.only_json }}
      overrides_json: ${{ steps.c.outputs.overrides_json }}
      code_heavy: ${{ steps.c.outputs.code_heavy }}
      has_images: ${{ steps.c.outputs.has_images }}
      ticket: ${{ steps.c.outputs.ticket }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr diff "$PR" --repo "$R" --name-only > files.txt
          TOTAL=$(grep -c . files.txt || true)
          ADOC=$(grep -cE '\.adoc$' files.txt || true)
          JSON=$(grep -cE '\.json$' files.txt || true)
          OVERRIDES=$(grep -ciE '(^|/)[^/]*overrides[^/]*\.json$' files.txt || true)
          IMG=$(grep -cE '\.(png|svg|jpe?g|gif|webp)$' files.txt || true)
          CODE=$(grep -cE '\.(go|java|py|js|ts|jsx|tsx|sh|sql|proto|c|cc|cpp|rs)$' files.txt || true)
          {
            echo "has_adoc=$([[ $ADOC -gt 0 ]] && echo true || echo false)"
            echo "only_json=$([[ $TOTAL -gt 0 && $JSON -eq $TOTAL ]] && echo true || echo false)"
            echo "overrides_json=$([[ $OVERRIDES -gt 0 ]] && echo true || echo false)"
            # Code-heavy heuristic (decision 3): ≥3 code files AND more code
            # files than .adoc files. The callers are all content repos, so
            # what this catches is EXAMPLE code shipped alongside a page (a
            # lab, a quickstart's docker-compose + client snippets), not the
            # main content — the code pass is additive to the prose
            # review, never a substitute for it. Tune with data.
            echo "code_heavy=$([[ $CODE -ge 3 && $CODE -gt $ADOC ]] && echo true || echo false)"
            echo "has_images=$([[ $IMG -gt 0 ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          TICKET=$(gh pr view "$PR" --repo "$R" --json title,body,headRefName \
            --jq '[.title, .body // "", .headRefName] | join(" ")' \
            | grep -oE 'DOC-[0-9]+' | head -1 || true)
          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────
  # §4a — deterministic style lint. Informational: it never fails the review.
  # Runs docs-team-standards' style lint (its Vale rules plus xref and image
  # target checks) from the pinned plugin, on the lines this PR changed.
  # Findings become the "Style lint" row, all as suggestions, and adoc_review
  # is handed the same output so Claude neither re-derives nor repeats it.
  # Every failure path here writes a "did not run" note instead of failing,
  # and the aggregate treats a missing result as informational too.
  # ──────────────────────────────────────────────────────────────────────
  style_lint:
    needs: [gate, classify]
    if: needs.classify.outputs.has_adoc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    env:
      VALE_VERSION: 3.22.0
      ASCIIDOCTOR_VERSION: 2.0.26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      # Same read-only App token and pin as the plugin checkout in claude-skill,
      # so the lint and the skills that consume its output version together.
      - name: Mint a read-only token for the plugin checkout
        id: standards_token
        if: inputs.docs_app_id != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.docs_app_id }}
          private-key: ${{ secrets.docs_app_private_key }}
          owner: redpanda-data
          repositories: docs-team-standards
          permission-contents: read

      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: redpanda-data/docs-team-standards
          ref: ${{ inputs.plugin_ref }}
          path: .standards
          token: ${{ steps.standards_token.outputs.token || github.token }}
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        continue-on-error: true
        with:
          ruby-version: '3.3'

      - name: Install Vale and Asciidoctor
        continue-on-error: true
        run: |
          set -euo pipefail
          tarball="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          base="https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$tarball"
          curl -fsSL "$base/vale_${VALE_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          mkdir -p bin && tar -xzf "$tarball" -C bin vale
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          gem install --no-document asciidoctor -v "$ASCIIDOCTOR_VERSION"

      # The diff comes from the API because the checkout is shallow: there is
      # no merge base to diff against locally. Fetched in its own step so the
      # token isn't in the environment that parses the PR's pages.
      - name: Fetch the PR diff
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/style-lint"
          gh pr diff "$PR" --repo "$R" > "$RUNNER_TEMP/style-lint/pr.diff"
          gh pr diff "$PR" --repo "$R" --name-only > "$RUNNER_TEMP/style-lint/changed.txt"

      - name: Run the style lint on the lines this PR changed
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/style-lint"; mkdir -p "$OUT"
          # One way out for every "could not lint" case: a pass verdict with
          # the reason as its only suggestion, and the same reason at the top
          # of findings.txt for the prose review to read.
          skip() {
            jq -n --arg n "Style lint did not run: $1" '{verdict:"pass", blocking:[], suggestions:[$n]}' > "$OUT/verdict.json"
            printf '# style lint did not run: %s\n' "$1" > "$OUT/findings.txt"
            echo "style-lint: skipped ($1)"
            exit 0
          }
          [[ -d modules ]] || skip "no modules/ directory, so this isn't an Antora content repo"
          [[ -f .standards/scripts/style-lint.sh ]] || skip "the pinned docs-team-standards (plugin_ref) predates the style lint"
          [[ -s "$OUT/pr.diff" ]] || skip "the PR diff could not be fetched"
          FILES=()
          while IFS= read -r f; do FILES+=("$f"); done < <(grep '\.adoc$' "$OUT/changed.txt" || true)
          if [[ ${#FILES[@]} -eq 0 ]]; then
            jq -n '{verdict:"pass", blocking:[], suggestions:[]}' > "$OUT/verdict.json"
            printf '# style lint ran: no changed .adoc files\n' > "$OUT/findings.txt"
            exit 0
          fi
          bash .standards/scripts/style-lint.sh --format json --diff-file "$OUT/pr.diff" "${FILES[@]}" \
            > "$OUT/result.json" 2> "$OUT/stderr.txt"
          rc=$?
          if [[ $rc -eq 2 ]] || ! jq -e 'type == "array"' "$OUT/result.json" > /dev/null 2>&1; then
            skip "$(tr '\n' ' ' < "$OUT/stderr.txt" | head -c 300)"
          fi
          n=$(jq 'length' "$OUT/result.json")
          { printf '# style lint ran: %s finding(s) on lines this PR changed\n' "$n"
            jq -r '.[] | "\(.file):\(.line):\(.col) \(.severity) \(.rule) \(.message)"' "$OUT/result.json"
          } > "$OUT/findings.txt"
          # Errors, then warnings, all as suggestions: the lint informs the
          # review and never blocks it. Suggestion-level hits (future tense,
          # weak modifiers) stay in findings.txt for the prose review only.
          jq '{verdict: "pass", blocking: [],
               suggestions: ([.[] | select(.severity == "error")] + [.[] | select(.severity == "warning")]
                             | map("\(.file):\(.line) \(.message) (`\(.rule)`)"))}' \
            "$OUT/result.json" > "$OUT/verdict.json"
          jq -r '"style-lint: \(.suggestions | length) finding(s) reported as suggestions"' "$OUT/verdict.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: style-lint
          path: |
            ${{ runner.temp }}/style-lint/verdict.json
            ${{ runner.temp }}/style-lint/findings.txt
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — /docs-team-standards:pr-review over the .adoc changes.
  # ──────────────────────────────────────────────────────────────────────
  adoc_review:
    needs: [gate, classify, style_lint]
    # Not skipped when style_lint fails: the lint is informational, so the
    # prose review runs either way and checks by hand if it has no output.
    if: ${{ !cancelled() && needs.classify.result == 'success' && needs.classify.outputs.has_adoc == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 45
    steps:
      # Under RUNNER_TEMP: the claude-skill action's checkout runs git clean in
      # the workspace. continue-on-error: no artifact means the prose review
      # falls back to checking the lint's rules by hand.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: style-lint
          path: ${{ runner.temp }}/style-lint
      - uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        id: claude
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          prompt: >
            /docs-team-standards:pr-review ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}
            HEADLESS MODE — you are running in CI with no human present.
            The PR's head is ALREADY checked out in the working directory:
            do not run `gh pr checkout` or `git remote` (both are refused
            here); read files in place and use `gh pr diff` for the diff.
            Do NOT post anything to GitHub; there is no approval step here,
            so the pr-review rule "never post without approval" means: never
            post. Where the pr-review flow would spawn the content-reviewer
            agent for prose feedback, do so. This repository's own CLAUDE.md
            files (in the working tree, taken from the base branch) carry
            rules that apply only to this repo: apply them alongside the
            plugin's skills, and where a repo-local rule is more specific
            than a plugin rule, the repo-local rule wins. If Jira is
            unreachable, note that in the findings instead of failing.
            The pipeline already ran the style lint on the lines this PR
            changed: read ${{ runner.temp }}/style-lint/findings.txt. Its first
            line says whether it ran. If it ran, use it as the caller-provided
            lint output the review skill describes and do not run
            style-lint.sh yourself. The pipeline reports those findings in its
            own non-blocking row, so do not repeat them in your findings or
            verdict, and never make the verdict fail for anything the lint
            covers, including when you check those rules by hand because the
            file is missing or says it did not run. Write human-readable
            findings to review-output/findings.md and a machine verdict to
            review-output/verdict.json with the exact schema
            {"verdict":"pass"|"fail","blocking":["..."],"suggestions":["..."]}
            where "fail" means at least one genuinely blocking violation of
            team standards.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adoc-review
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — JSON-only PRs (decision 4). docs-team-standards: the PR #2902
  # deterministic validators. Content repos: headless overrides-review for
  # *overrides*.json; plain jq validity for anything else.
  # ──────────────────────────────────────────────────────────────────────
  json_validation:
    needs: [gate, classify]
    if: needs.classify.outputs.only_json == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - name: Deterministic validation (docs-team-standards)
        if: github.repository == 'redpanda-data/docs-team-standards'
        run: |
          set -euo pipefail
          mkdir -p review-output
          FAILED=0
          python3 scripts/validate-manifests.py || FAILED=1
          if compgen -G "evaluations/tier-*/*.eval.json" > /dev/null; then
            npx --yes ajv-cli@5.0.0 validate -s evaluations/schema.json \
              -d "evaluations/tier-*/*.eval.json" || FAILED=1
          fi
          if [[ "$FAILED" -eq 1 ]]; then
            jq -n '{verdict:"fail",blocking:["JSON validation failed (validate-manifests / eval schema) — see job log"],suggestions:[]}' > review-output/verdict.json
          else
            jq -n '{verdict:"pass",blocking:[],suggestions:[]}' > review-output/verdict.json
          fi

      - name: Basic JSON validity (content repos, non-overrides)
        if: github.repository != 'redpanda-data/docs-team-standards' && needs.classify.outputs.overrides_json != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p review-output
          BAD=()
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue   # deleted files
            jq -e . "$f" > /dev/null 2>&1 || BAD+=("$f")
          done < <(gh pr diff "${{ inputs.pr_number }}" --repo "${{ github.repository }}" --name-only | grep -E '\.json$')
          if [[ ${#BAD[@]} -gt 0 ]]; then
            printf '%s\n' "${BAD[@]}" | jq -R . | jq -s '{verdict:"fail",blocking:(map("Invalid JSON: " + .)),suggestions:[]}' > review-output/verdict.json
          else
            jq -n '{verdict:"pass",blocking:[],suggestions:[]}' > review-output/verdict.json
          fi

      - name: Overrides review (content repos, decision 4)
        if: github.repository != 'redpanda-data/docs-team-standards' && needs.classify.outputs.overrides_json == 'true'
        uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          prompt: >
            /docs-team-standards:overrides-review — review the overrides
            JSON changes in ${{ github.server_url }}/${{ github.repository }}/pull/${{ inputs.pr_number }}.
            HEADLESS MODE: do NOT post anything to GitHub. Apply this
            repository's own CLAUDE.md rules (in the working tree, from the
            base branch) alongside the skill. Write findings to
            review-output/findings.md and review-output/verdict.json with schema
            {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...]}.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: json-validation
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — code pass for code-example-heavy PRs (additive to adoc_review).
  # In content repos "code-heavy" means example code shipped with a page, so
  # this pass checks that the examples are correct — the prose review above
  # still owns the page itself. This pipeline also has at least one
  # tooling-repo caller (docs-team-standards, whose own scripts/workflows are
  # its "code"), so the prompt below asks Claude to tell the two cases apart
  # rather than assuming every caller is a content repo.
  #
  # The prompt spells the task out instead of invoking /code-review. That
  # command comes from the code-review plugin in the claude-plugins-official
  # marketplace, which installs under the Claude config dir, and this action
  # points CLAUDE_CONFIG_DIR at a fresh empty directory on purpose so nothing
  # on the runner can inject settings or hooks into a review. So the plugin
  # never loads, the slash command would degrade to literal prompt text, and
  # the job would stay green while reviewing without it. It is not a CLI
  # built-in and docs-team-standards does not ship it either.
  # ──────────────────────────────────────────────────────────────────────
  code_review:
    needs: [gate, classify]
    if: needs.classify.outputs.code_heavy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 45
    steps:
      - uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          prompt: >
            Review the code changed by pull request
            ${{ inputs.pr_number }} in this repository. Read the diff with
            `gh pr diff`, then read the changed files in the working tree for
            the context the diff alone does not show. Report correctness bugs
            first: something that is wrong, breaks, or does not do what the
            surrounding prose or code says it does. Note obvious
            simplifications only where they are clearly worth it, and skip
            style preferences. For anything you report, give the file, the
            line, and the concrete circumstances under which it goes wrong,
            and say so plainly if you are unsure rather than padding the list.
            HEADLESS MODE: do NOT post comments or apply fixes. First decide
            whether the changed code files are documentation EXAMPLES that
            ship with a page (a lab, a quickstart snippet) or this
            repository's OWN implementation code (scripts, CI, tooling) —
            most callers of this review are content repos where changed code
            is examples, but not all are. If they are examples, judge them as
            a reader will copy them (correct, runnable, matching the prose).
            If they are this repo's own implementation, review them as
            regular code (correctness, not doc-example fidelity). Either way,
            apply this repository's own CLAUDE.md rules (in the working tree,
            from the base branch). Write findings to
            review-output/findings.md and review-output/verdict.json
            with schema {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...]}
            where "fail" means a confirmed correctness bug.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-review
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §5 — screenshot standards: deterministic lint + Claude vision pass.
  # The lint is `doc-tools lint-screenshots` from docs-extensions-and-macros
  # — the ONE implementation, promoted from cloud-docs' repo-local script,
  # that cloud-docs also runs on every PR and in its daily screenshot cron
  # — so no two jobs disagree about the same 100KB limit. It runs on any
  # .adoc or image change (alt text lives in the .adoc); the paid vision
  # pass runs only when an image file changed.
  # ──────────────────────────────────────────────────────────────────────
  screenshot_gate:
    needs: [gate, classify]
    if: needs.classify.outputs.has_images == 'true' || needs.classify.outputs.has_adoc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deterministic checks (doc-tools lint-screenshots)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          DOC_TOOLS_VERSION: ${{ inputs.doc_tools_version }}
        run: |
          set -euo pipefail
          # Everything lands under RUNNER_TEMP: the claude-skill action's
          # own checkout runs `git clean` in the workspace and would delete
          # anything written there before the merge step reads it.
          LINT_DIR="$RUNNER_TEMP/screenshot-lint"; mkdir -p "$LINT_DIR"
          OUT="$LINT_DIR/screenshot-lint.json"
          if [[ ! -d modules ]]; then
            # Not an Antora content repo (docs-site, docs-team-standards): nothing
            # to lint, and the pipeline's posture is that "nothing to check"
            # is a pass, not a red X.
            jq -n '{verdict:"pass", blocking:[], suggestions:["No modules/ directory in this repo — screenshot lint skipped"]}' > "$OUT"
            exit 0
          fi
          gh pr diff "$PR" --repo "$R" --name-only > "$LINT_DIR/changed-files.txt"
          # --files: only pages changed in the PR plus pages that use a changed
          # image. A whole-repo scan would flag every pre-existing violation
          # in a repo that has never been linted (docs has dozens today).
          # Exit 1 means findings — the jq below turns them into the verdict.
          # Any other non-zero exit (usage error, npx failure) fails the step.
          npx --yes --package "@redpanda-data/docs-extensions-and-macros@${DOC_TOOLS_VERSION}" \
            doc-tools lint-screenshots --files "$LINT_DIR/changed-files.txt" \
            --format json --output "$LINT_DIR/result.json" > /dev/null || [[ $? -eq 1 ]]
          # An unrecognized `lint-screenshots` subcommand (doc_tools_version
          # pinned to a release that predates it) also exits 1, the same code
          # the line above tolerates for "findings present" — but it writes no
          # result.json. Tell the two apart before jq turns a missing file
          # into a cryptic crash.
          if [[ ! -s "$LINT_DIR/result.json" ]]; then
            echo "::error::doc-tools lint-screenshots produced no output at doc_tools_version=${DOC_TOOLS_VERSION} — the pin may predate this subcommand, or npx failed to install it"
            exit 1
          fi
          jq '
            def line: "\(.file)\(if .line then ":\(.line)" else "" end)\(if .image then " [\(.image)]" else "" end) \(.message)";
            {
              verdict: (if .summary.errors > 0 then "fail" else "pass" end),
              blocking:    [.findings[] | select(.severity == "error")   | line],
              suggestions: [.findings[] | select(.severity == "warning") | line]
            }' "$LINT_DIR/result.json" > "$OUT"
          jq -r '"screenshot-lint: verdict=\(.verdict), \(.blocking | length) blocking, \(.suggestions | length) suggestion(s)"' "$OUT"

      - name: Claude vision pass
        if: needs.classify.outputs.has_images == 'true'
        uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          # Its own directory, not review-output: review-output/verdict.json
          # is the job's FINAL merged verdict, and the aggregate treats a
          # present verdict.json as "this branch ran". Writing the vision
          # verdict there made a soft-failed vision pass indistinguishable
          # from a clean one, because the merge below then filled that same
          # file with the deterministic lint's pass.
          output_dir: review-output/vision
          prompt: >
            Review every image file changed in PR #${{ inputs.pr_number }} of
            ${{ github.repository }} against the plugin's screenshot
            standard: read .docs-team-standards-plugin/resources/screenshot-standards.md
            first and apply its judgment rules (purpose test; sanitize-at-
            capture preferred, solid overlay only as the fallback for
            existing images; crop and annotation rules; alt text agreeing
            with prose). Do not repeat the deterministic size/alt-text
            checks — `doc-tools lint-screenshots` runs those separately. If
            that file is ABSENT, the plugin pin predates
            docs-team-standards#2929: write review-output/vision/findings.md
            saying so and write NO verdict.json, so this branch reports
            "automated review unavailable" instead of grading against rules
            it cannot read. Read each image file directly. Do NOT post to
            GitHub. Write
            review-output/vision/screenshots.json as
            [{"file":"...","checks":{...},"verdict":"pass"|"fail","notes":"..."}]
            and review-output/vision/verdict.json as
            {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...]}
            covering only the judgment checks.

      - name: Merge deterministic + vision verdicts
        if: always()
        env:
          HAS_IMAGES: ${{ needs.classify.outputs.has_images }}
        run: |
          set -uo pipefail
          mkdir -p review-output
          LINT="$RUNNER_TEMP/screenshot-lint/screenshot-lint.json"
          VISION=review-output/vision/verdict.json
          FINAL=review-output/verdict.json
          # Keep the raw lint verdict in the artifact next to the merged one.
          [[ -f "$LINT" ]] && cp "$LINT" review-output/screenshot-lint.json
          # Three states, and the third is the one that used to be reported as
          # a clean pass. The aggregate reads a present verdict.json as "this
          # branch produced a verdict", so when a pass that was SUPPOSED to run
          # produced nothing, the only honest thing is to leave verdict.json
          # absent and let the aggregate say "automated review unavailable".
          if [[ ! -f "$LINT" ]]; then
            echo "::warning::no deterministic lint result — leaving no verdict so the aggregate reports this branch unavailable"
            exit 0
          fi
          if [[ "${HAS_IMAGES:-}" != "true" ]]; then
            # No image changed, so the vision pass was never meant to run and
            # the lint alone is the complete answer for this PR.
            cp "$LINT" "$FINAL"
            echo "no image changes: verdict is the deterministic lint alone"
            exit 0
          fi
          if [[ ! -f "$VISION" ]]; then
            echo "::warning::the vision pass produced no verdict (soft-failed) — leaving no merged verdict so the aggregate reports this branch unavailable rather than passing it on the lint alone"
            exit 0
          fi
          jq -s '{
            verdict: (if (.[0].verdict=="fail" or .[1].verdict=="fail") then "fail" else "pass" end),
            blocking: ((.[0].blocking // []) + (.[1].blocking // [])),
            suggestions: ((.[0].suggestions // []) + (.[1].suggestions // []))
          }' "$LINT" "$VISION" > "$FINAL"
          echo "merged the deterministic lint with the vision verdict"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-gate
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §4 — constrained doc-ticket delta pass (decision 10: stages 1–2 only).
  # ──────────────────────────────────────────────────────────────────────
  ticket_delta:
    needs: [gate, classify, adoc_review]
    if: needs.classify.outputs.ticket != '' && needs.classify.outputs.has_adoc == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write   # OIDC role for the ADP gateway credential
    timeout-minutes: 45
    steps:
      # Under RUNNER_TEMP, not the workspace: the claude-skill action's own
      # checkout runs `git clean` there and would delete the download before
      # the prompt reads it. continue-on-error: adoc_review uploads nothing
      # when the skill wrote no files (if-no-files-found: ignore), and a
      # missing prose-review artifact must degrade the delta, not skip it.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: adoc-review
          path: ${{ runner.temp }}/prior-review
      - uses: redpanda-data/docs-extensions-and-macros/.github/actions/claude-skill@main # PIN-ME(step 2): replace with this repo's merge SHA — see TWO-STEP PIN in the header
        with:
          repo: ${{ github.repository }}
          pr_number: ${{ inputs.pr_number }}
          plugin_ref: ${{ inputs.plugin_ref }}
          aws_region: ${{ inputs.aws_region }}
          aws_role_name_prefix: ${{ inputs.aws_role_name_prefix }}
          aws_cred_account_id: ${{ secrets.aws_cred_account_id }}
          adp_client_secret_id: ${{ inputs.adp_client_secret_id }}
          plugin_app_id: ${{ inputs.docs_app_id }}
          plugin_app_private_key: ${{ secrets.docs_app_private_key }}
          cli_version: ${{ vars.CLAUDE_CLI_VERSION || '2.1.258' }}
          output_dir: review-output
          prompt: >
            Run ONLY stages 1–2 of /docs-team-standards:doc-ticket for
            ${{ needs.classify.outputs.ticket }} (dedupe + research; NO plan,
            NO draft — approval checkpoints cannot be granted in CI). If Jira
            is unreachable from this runner, derive the ticket's requirements
            from any quoted description in the PR body and say so. Then
            compare the ticket's requirements against the pr-review findings
            in ${{ runner.temp }}/prior-review/findings.md and this PR's diff
            (if that file does not exist, the prose review produced no
            findings file — say so and compare against the diff alone). Do
            NOT post to GitHub. Write the delta report (requirements the PR misses; PR
            content the ticket doesn't cover) to review-output/ticket-delta.md
            and review-output/verdict.json as
            {"verdict":"pass"|"fail","blocking":[...],"suggestions":[...]}
            where "fail" means the PR clearly misses a requirement the ticket
            states.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ticket-delta
          path: review-output/
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────
  # §6 — one verdict, one upserted comment, final informational status.
  # ──────────────────────────────────────────────────────────────────────
  aggregate:
    needs: [gate, classify, style_lint, adoc_review, json_validation, code_review, screenshot_gate, ticket_delta]
    if: always() && needs.gate.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    # 25, not 15: preview-links.sh now waits up to 10 minutes for the
    # Netlify deploy (observed docs-repo deploys land between 4m22s and
    # 5m09s — a 5-minute bound sat right on the boundary).
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
      checks: read
    steps:
      # docs-team-standards is private: github.token cannot clone it from
      # any other repo, so the scripts checkout uses a per-run App token
      # scoped to that repo with Contents: read (same as the plugin checkout
      # inside claude-skill). Empty docs_app_id = the caller is
      # docs-team-standards itself and github.token suffices.
      - name: Mint a read-only token for the scripts checkout
        id: standards_token
        if: inputs.docs_app_id != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.docs_app_id }}
          private-key: ${{ secrets.docs_app_private_key }}
          owner: redpanda-data
          repositories: docs-team-standards
          permission-contents: read

      - uses: actions/checkout@v4
        with:
          repository: redpanda-data/docs-team-standards
          # Same pin as the skills plugin: scripts and skills version together.
          ref: ${{ inputs.plugin_ref }}
          path: .standards
          token: ${{ steps.standards_token.outputs.token || github.token }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: results
        continue-on-error: true

      - name: Build preview links
        id: previews
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          PREVIEW_PATH_PREFIX: ${{ vars.PREVIEW_PATH_PREFIX }}
        run: |
          bash .standards/scripts/preview-links.sh "$R" "$PR" preview-links.md || : > preview-links.md

      - name: Merge verdicts and build the comment
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          SME_APPROVER: ${{ needs.gate.outputs.sme_approver }}
          SME_MODE: ${{ needs.gate.outputs.sme_mode }}
          TICKET: ${{ needs.classify.outputs.ticket }}
          RESULT_ADOC: ${{ needs.adoc_review.result }}
          RESULT_LINT: ${{ needs.style_lint.result }}
          RESULT_JSON: ${{ needs.json_validation.result }}
          RESULT_CODE: ${{ needs.code_review.result }}
          RESULT_SHOTS: ${{ needs.screenshot_gate.result }}
          RESULT_TICKET: ${{ needs.ticket_delta.result }}
        run: |
          set -uo pipefail
          # Guarded like the preview-links call above it. If the aggregator
          # cannot run (missing from a plugin_ref that predates it, or a bug
          # in the script), an unguarded failure skips the two steps below,
          # so the PR gets no comment, no terminal status, and keeps the
          # gate's pending claim until the 90-minute stale window expires.
          # Degrade to the pipeline's standard infra-failure posture instead:
          # a comment carrying the same marker (so it still upserts in place),
          # a failure status, and needs-human-review.
          if ! bash .standards/scripts/aggregate-review.sh results comment.md; then
            echo "::warning::aggregate-review.sh could not run — posting the unavailable fallback"
            {
              echo "state=failure"
              echo "description=automated review unavailable, human review required"
              echo "labels=needs-human-review"
            } >> "$GITHUB_OUTPUT"
            {
              echo "<!-- docs-review:comment -->"
              echo "## 📋 Docs review: ⚠️ automated review unavailable"
              echo
              echo "The pipeline could not assemble a verdict for this revision (the"
              echo "aggregation step failed to run), so there is no automated result here."
              echo "Human review is required. See the [workflow run](${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}) for details."
              echo
              echo "**This workflow never merges.** Merge requires a documentation approval"
              echo "from a docs team member."
            } > comment.md
          fi

      - name: Upsert the review comment
        uses: actions/github-script@v7
        env:
          PR: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('comment.md', 'utf8');
            const issue_number = Number(process.env.PR);
            const marker = '<!-- docs-review:comment -->';
            // GitHub rejects issue comments over 65,536 characters; five
            // model-written findings files can exceed that even after the
            // aggregator's per-file cap.
            const MAX = 60000;
            if (body.length > MAX) {
              body = body.slice(0, MAX) + '\n\n…\n\n_Comment truncated — the full findings are in the workflow run artifacts._';
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number, body,
              });
            }

      - name: Apply labels and set the final status
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          R: ${{ github.repository }}
          HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
          STATE: ${{ steps.verdict.outputs.state }}
          DESCRIPTION: ${{ steps.verdict.outputs.description }}
          LABELS: ${{ steps.verdict.outputs.labels }}
        run: |
          set -euo pipefail
          if [[ -n "${LABELS:-}" ]]; then
            # gh api, not `gh pr edit --add-label`: pr edit trips on the
            # Projects-classic GraphQL deprecation in some repos.
            IFS=',' read -ra LS <<< "$LABELS"
            for L in "${LS[@]}"; do
              gh api "repos/$R/issues/$PR/labels" -f "labels[]=$L" > /dev/null 2>&1 || \
                echo "::warning::could not add label '$L' to $R#$PR"
            done
          fi
          # Informational status (decision 7 corrected): docs-review is NOT
          # a required check; the docs-team approval is the physical gate.
          gh api "repos/$R/statuses/$HEAD_SHA" \
            -f context="$REVIEW_STATUS_CONTEXT" \
            -f state="$STATE" \
            -f description="${DESCRIPTION:0:139}" \
            -f target_url="${GITHUB_SERVER_URL}/${R}/actions/runs/${GITHUB_RUN_ID}" > /dev/null
