---
# Reusable workflow: block hand edits to generated files.
#
# Content repos call this from a thin wrapper to fail any PR that modifies
# generated files without carrying a label their generation workflows apply
# (auto-docs by convention). This keeps "generated" meaning generated: the only
# path to changing those files is through the generator.
#
# Example caller (.github/workflows/lint-generated-content.yml in a docs repo):
#
#   name: lint-generated-content
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, labeled, unlabeled]
#   jobs:
#     guard:
#       uses: redpanda-data/docs-extensions-and-macros/.github/workflows/guard-generated-files.yml@main
#       with:
#         generated-paths: |
#           modules/reference/partials/generated/
#
name: guard-generated-files
on:
  workflow_call:
    inputs:
      generated-paths:
        description: >-
          Newline-separated path prefixes (relative to the repo root) of
          generated files. A prefix can be a directory
          ("modules/reference/partials/generated/") or an exact file path.
        required: true
        type: string
      exclude-paths:
        description: >-
          Newline-separated path prefixes to exempt even though they fall
          under generated-paths (for hand-written files inside generated
          directories).
        required: false
        type: string
        default: ''
      allow-labels:
        description: >-
          Newline-separated PR labels, any one of which marks
          generator-produced changes as allowed.
        required: false
        type: string
        default: auto-docs

jobs:
  block-manual-edits:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if generated files are edited without an allow label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GENERATED_PATHS: ${{ inputs.generated-paths }}
          EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
          ALLOW_LABELS: ${{ inputs.allow-labels }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          mapfile -t prefixes < <(printf '%s\n' "$GENERATED_PATHS" | sed 's/[[:space:]]*$//' | sed '/^[[:space:]]*$/d')
          if [ "${#prefixes[@]}" -eq 0 ]; then
            echo "::error::generated-paths input is empty."
            exit 1
          fi
          mapfile -t excludes < <(printf '%s\n' "$EXCLUDE_PATHS" | sed 's/[[:space:]]*$//' | sed '/^[[:space:]]*$/d')

          violations=()
          while IFS= read -r file; do
            excluded=false
            for e in ${excludes[@]+"${excludes[@]}"}; do
              if [[ "$file" == "$e"* ]]; then excluded=true; break; fi
            done
            if [ "$excluded" = true ]; then continue; fi
            for prefix in "${prefixes[@]}"; do
              if [[ "$file" == "$prefix"* ]]; then
                violations+=("$file")
                break
              fi
            done
          done < <(gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')

          if [ "${#violations[@]}" -eq 0 ]; then
            echo "No generated files changed."
            exit 0
          fi

          matched_label=$(jq -r --arg allow "$ALLOW_LABELS" \
            '($allow | split("\n") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $wanted
             | map(select(. as $l | $wanted | index($l))) | first // empty' \
            <<< "$PR_LABELS_JSON")

          if [ -n "$matched_label" ]; then
            echo "PR has the '${matched_label}' label; generated-file changes are allowed:"
            printf '  %s\n' "${violations[@]}"
            exit 0
          fi

          allow_list=$(printf '%s\n' "$ALLOW_LABELS" | sed '/^[[:space:]]*$/d' | paste -sd ', ' -)
          echo "::error::This PR modifies auto-generated files without an allow label (${allow_list}):"
          printf '%s\n' "${violations[@]}" | while IFS= read -r f; do
            echo "::error file=${f}::Auto-generated file edited by hand: ${f}"
          done
          echo "::error::These files are produced by a generation workflow. Update the source data or the generator template instead, or add one of the labels (${allow_list}) if this change genuinely comes from the generator."
          exit 1
