name: Iceberg mode drift

# Regenerates the redpanda.iceberg.mode release data from Redpanda's source and
# fails when the committed copy differs.
#
# extension-utils/iceberg-mode-releases.json (which grammar each release
# accepts) and __tests__/fixtures/iceberg-mode/upstream-vectors.js (the upstream
# test cases) are generated by tools/iceberg-mode/generate.js from
# streaming-enterprise at every release tag. The iceberg-explorer macro
# validates a page's config against the first, so it is only as current as the
# last regeneration.
#
# Why a schedule: a Redpanda release (a new series, a release candidate, or a
# patch that changes the parser) lands in streaming-enterprise with no file
# change in THIS repo, so no PR-triggered check would ever see it. A patch
# release that leaves the parser alone changes neither file, so this stays
# green between real changes.
#
# When it fails: run `node tools/iceberg-mode/generate.js` locally (it uses
# `gh auth token`), commit both files, and, if the diff names a new parser
# fingerprint, review extension-utils/iceberg-mode.js against that release's
# model.cc and add the fingerprint to PORTED_PARSERS. The unit tests fail until
# that is done.

on:
  schedule:
    # Mondays 09:00 UTC, after the Kapa (06:00), property-corpus (07:00) and
    # dispatch-graph (08:00) checks so they never contend for the bot token.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Check iceberg mode release data
    runs-on: ubuntu-latest
    steps:
      # streaming-enterprise is private, and github.token cannot read another
      # repository, so the org bot token is what makes this check possible.
      # Fetched only on the default branch, same boundary as
      # check-dispatch-graph.yml: workflow_dispatch can be aimed at any branch a
      # user with write access selects, and checkout below has no explicit ref,
      # so a modified generator on that branch would otherwise run holding the
      # org token. A dispatch off main runs without it and fails at the first
      # request, which is the intended result for someone testing on a branch.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}

      - name: Get the bot token
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true

      - uses: actions/checkout@v4

      # The generator uses only Node built-ins, so there is nothing to install.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate from streaming-enterprise
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
        run: node tools/iceberg-mode/generate.js

      - name: Fail on drift
        run: |
          set +e
          git diff --exit-code -- extension-utils/iceberg-mode-releases.json __tests__/fixtures/iceberg-mode/upstream-vectors.js
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::The iceberg mode release data is out of date. Run node tools/iceberg-mode/generate.js and commit the result (see the header of this workflow)."
            exit 1
          fi
