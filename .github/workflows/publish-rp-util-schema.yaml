---
# Builds rp_util (redpanda-data/streaming-enterprise) at a given tag and
# publishes its cluster/node config schema JSON as a release on this repo.
#
# rp_util's own source comment says it "may not be shipped as a part of
# official release artifacts" -- that's about streaming-enterprise's/redpanda's
# release process, not this one. This workflow never ships the rp_util binary
# itself, only its JSON schema output, as an internal snapshot this repo's own
# property-docs generation consumes. See tools/property-extractor/rp-util-fetch.js
# and rp_util_merge.py for how that consumption works.
#
# Why three triggers: release-day property-docs generation HARD-FAILS when no
# rp_util schema exists for the release tag (merge-rp-util.js refuses to ship
# the Tree-sitter-only misparse), so the schema has to exist before that run.
#   - repository_dispatch lets streaming-enterprise's dispatch-docs-updates.yml
#     fire this the moment a GA release or RC tag lands (one extra dispatch
#     step there, event-type publish-rp-util-schema, payload {"tag": ...}).
#   - schedule is the self-maintaining backstop: every six hours it publishes
#     a schema for any recent release/RC tag that doesn't have one, so a
#     missed or failed dispatch heals without anyone remembering to run it.
#   - workflow_dispatch stays for backfills and one-offs.
name: publish-rp-util-schema
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'streaming-enterprise tag to build rp_util from (e.g. v26.2.2)'
        required: true
  repository_dispatch:
    types: [publish-rp-util-schema]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  id-token: write
  contents: write
# One run at a time: concurrent runs would race each other creating the same
# rp-util-schema-<tag> release. Queued runs still execute (no cancellation),
# so a dispatch arriving mid-scheduled-run is not lost.
concurrency:
  group: publish-rp-util-schema
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.missing.outputs.tags }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - name: Resolve tags that still need a schema release
        id: missing
        env:
          # Tag values are read as "$VAR", never spliced into the script via
          # ${{ }}: a repository_dispatch payload (or a hostile ref name)
          # must not be able to inject shell into a job holding a bot token.
          # toJSON() keeps a value containing quotes from breaking the env
          # assignment itself.
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}
          DISPATCH_TAG: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.tag) || '""' }}
          GH_TOKEN: ${{ github.token }}
          SE_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Same release/RC shape merge-rp-util.js's RELEASE_TAG_RX accepts,
          # and the strict -rc[0-9]+$ pattern streaming-enterprise's own
          # dispatch workflow re-validates with.
          TAG_RX='^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$'

          candidates=()
          case "$EVENT_NAME" in
            workflow_dispatch)
              candidates+=("$INPUT_TAG")
              ;;
            repository_dispatch)
              tag=$(printf '%s' "$DISPATCH_TAG" | python3 -c 'import json,sys; v=json.load(sys.stdin); print(v if isinstance(v, str) else "")')
              candidates+=("$tag")
              ;;
            schedule)
              # Newest 6 release/RC tags. RC tags never get a GitHub Release
              # in streaming-enterprise (they're plain tag pushes), so list
              # tags via git, not the releases API.
              while IFS= read -r tag; do
                candidates+=("$tag")
              done < <(git ls-remote --tags --refs \
                  "https://x-access-token:${SE_TOKEN}@github.com/redpanda-data/streaming-enterprise.git" \
                | awk -F'refs/tags/' '{print $2}' \
                | grep -E "$TAG_RX" \
                | sort -V | tail -6)
              ;;
          esac

          missing=()
          for tag in "${candidates[@]}"; do
            if ! printf '%s' "$tag" | grep -qE "$TAG_RX"; then
              echo "Skipping '$tag': not a release or RC tag" >&2
              continue
            fi
            if gh release view "rp-util-schema-${tag}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "rp-util-schema-${tag} already published; skipping" >&2
              continue
            fi
            missing+=("$tag")
          done

          tags=$(printf '%s\n' "${missing[@]+"${missing[@]}"}" | python3 -c 'import json,sys; print(json.dumps([l for l in sys.stdin.read().splitlines() if l]))')
          echo "Tags to build: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build-and-publish:
    needs: resolve
    if: needs.resolve.outputs.tags != '[]'
    # Pinned, not ubuntu-latest: Bazel's rules_foreign_cc bundles a prebuilt
    # ninja binary requiring glibc >= 2.38, which Ubuntu 22.04 (glibc 2.35)
    # doesn't have. Confirmed locally via CMake's own "GLIBC_2.38 not found"
    # failure. ubuntu-latest is migrating to 24.04 but isn't there on every
    # runner yet, so pin explicitly rather than depend on the rollout.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Serial: each build is a full Bazel run; two at once just thrash the
      # runner pool for a task with no deadline tighter than "before the next
      # release's docs generation".
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.tags) }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - name: Checkout streaming-enterprise
        uses: actions/checkout@v6
        with:
          repository: redpanda-data/streaming-enterprise
          ref: ${{ matrix.tag }}
          token: ${{ env.ACTIONS_BOT_TOKEN }}
          path: streaming-enterprise
          persist-credentials: false
      - name: Install build dependencies
        # libatomic1: the hermetic LLVM toolchain's clang binary is linked
        # against libatomic.so.1. build-essential + the autotools set below:
        # several rules_foreign_cc genrules (liburing, krb5, ...) shell out
        # straight to configure+make on PATH rather than through Bazel's own
        # toolchain resolution. Usually already present on ubuntu-latest, but
        # installed explicitly rather than assumed -- see rp-util-fetch.js's
        # Docker path for how this list was arrived at.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y libatomic1 build-essential \
            perl bison flex python3 pkg-config m4 autoconf automake libtool gawk texinfo
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: true
          module-root: streaming-enterprise
      - name: Build rp_util
        working-directory: streaming-enterprise
        env:
          CI: false
        run: bazel build --lockfile_mode=off //src/v/rp_util:rp_util
      - name: Generate schema JSON
        run: |
          mkdir -p schema-out
          BIN=streaming-enterprise/bazel-bin/src/v/rp_util/rp_util
          "$BIN" --config_schema_json > schema-out/cluster-config-schema.json
          "$BIN" --node_config_schema_json > schema-out/node-config-schema.json
          "$BIN" --pandaproxy_config_schema_json > schema-out/pandaproxy-config-schema.json
          "$BIN" --kafka_client_config_schema_json > schema-out/kafka-client-config-schema.json
          "$BIN" --schema_registry_config_schema_json > schema-out/schema-registry-config-schema.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          # A run queued behind another (see concurrency above) can find its
          # release already published; skipping is success, not failure.
          if gh release view "rp-util-schema-${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "rp-util-schema-${TAG} already exists; nothing to do."
            exit 0
          fi
          gh release create "rp-util-schema-${TAG}" \
            schema-out/*.json \
            --repo "${{ github.repository }}" \
            --title "rp_util schema for streaming-enterprise ${TAG}" \
            --notes "Cluster and broker (node, Pandaproxy, its Kafka client, Schema Registry) config schema JSON generated by rp_util from redpanda-data/streaming-enterprise@${TAG}. An internal snapshot for this repo's own property-docs generation -- not an official Redpanda release artifact."
