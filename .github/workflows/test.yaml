---
name: Test Extensions and Macros

on:
  pull_request:
    branches: [main]
  schedule:
    # Run all tests weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.changes.outputs.extensions }}
      macros: ${{ steps.changes.outputs.macros }}
      asciidoc_extensions: ${{ steps.changes.outputs.asciidoc_extensions }}
      tools: ${{ steps.changes.outputs.tools }}
      property_extractor: ${{ steps.changes.outputs.property_extractor }}
      package_json: ${{ steps.changes.outputs.package_json }}
      all_tests: ${{ steps.changes.outputs.all_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            extensions:
              - 'extensions/**'
              - '__tests__/extensions/**'
              - '__tests__/**/*extension*.test.js'
            macros:
              - 'macros/**'
              - '__tests__/macros/**'
              - '__tests__/**/*macro*.test.js'
            asciidoc_extensions:
              - 'asciidoc-extensions/**'
              - '__tests__/asciidoc-extensions/**'
              - '__tests__/**/*asciidoc*.test.js'
            tools:
              - 'tools/**'
              - 'cli-utils/**'
              - 'bin/**'
              - '__tests__/tools/**'
              - '__tests__/cli-utils/**'
              - '__tests__/**/*tool*.test.js'
            property_extractor:
              - 'tools/property-extractor/**/*.py'
              - 'tools/property-extractor/requirements.txt'
            package_json:
              - 'package.json'
              - 'package-lock.json'
            all_tests:
              - '__tests__/**'
              - 'jest.config.js'
              - 'jest.unit.config.js'
              - '.github/workflows/**'
              - '.github/scripts/**'

  test-extensions:
    needs: detect-changes
    if: needs.detect-changes.outputs.extensions == 'true' || needs.detect-changes.outputs.all_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed extension files
        id: changed-extensions
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '^extensions/.*\.js$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '^extensions/.*\.js$' || true)
          fi

          if [[ -n "$CHANGED_FILES" ]]; then
            # Build Jest test pattern for specific extension tests
            TEST_PATTERNS="__tests__/extensions/"
            for file in $CHANGED_FILES; do
              extension_name=$(basename "$file" .js)
              # Anchored to .test.js so this doesn't match as a bare
              # substring against unrelated suites elsewhere in the tree
              # (e.g. "prop" would otherwise also select
              # __tests__/tools/lint-strings/properties-surface.test.js,
              # which needs an environment this job never bootstraps).
              TEST_PATTERNS="$TEST_PATTERNS ${extension_name}\.test\.js"
            done
            echo "test-patterns=$TEST_PATTERNS" >> $GITHUB_OUTPUT
            echo "Changed extensions: $CHANGED_FILES"
            echo "Test patterns: $TEST_PATTERNS"
          else
            # Run all extension tests if no specific files changed
            echo "test-patterns=__tests__/extensions/" >> $GITHUB_OUTPUT
          fi

      - name: Run extension tests
        run: |
          if [[ -n "${{ steps.changed-extensions.outputs.test-patterns }}" ]]; then
            npm test -- ${{ steps.changed-extensions.outputs.test-patterns }} --passWithNoTests
          else
            echo "No extension tests to run"
          fi

  test-macros:
    needs: detect-changes
    if: needs.detect-changes.outputs.macros == 'true' || needs.detect-changes.outputs.all_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get changed macro files
        id: changed-macros
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }} | grep -E '^macros/.*\.js$' || true)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '^macros/.*\.js$' || true)
          fi

          if [[ -n "$CHANGED_FILES" ]]; then
            # Build Jest test pattern for specific macro tests
            TEST_PATTERNS="__tests__/macros/"
            for file in $CHANGED_FILES; do
              macro_name=$(basename "$file" .js)
              # Anchored to .test.js so this doesn't match as a bare
              # substring against unrelated suites elsewhere in the tree
              # (e.g. "prop" would otherwise also select
              # __tests__/tools/lint-strings/properties-surface.test.js,
              # which needs an environment this job never bootstraps).
              TEST_PATTERNS="$TEST_PATTERNS ${macro_name}\.test\.js"
            done
            echo "test-patterns=$TEST_PATTERNS" >> $GITHUB_OUTPUT
            echo "Changed macros: $CHANGED_FILES"
            echo "Test patterns: $TEST_PATTERNS"
          else
            # Run all macro tests if no specific files changed
            echo "test-patterns=__tests__/macros/" >> $GITHUB_OUTPUT
          fi

      - name: Run macro tests
        run: |
          if [[ -n "${{ steps.changed-macros.outputs.test-patterns }}" ]]; then
            npm test -- ${{ steps.changed-macros.outputs.test-patterns }} --passWithNoTests
          else
            echo "No macro tests to run"
          fi

  test-asciidoc-extensions:
    needs: detect-changes
    if: needs.detect-changes.outputs.asciidoc_extensions == 'true' || needs.detect-changes.outputs.all_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AsciiDoc extension tests
        run: npm test -- __tests__/asciidoc-extensions/ --passWithNoTests

  test-tools:
    needs: detect-changes
    if: needs.detect-changes.outputs.tools == 'true' || needs.detect-changes.outputs.all_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The lint-strings properties surface and preview-string shell out to the
      # real Python property extractor, so their integration assertions - the
      # only ones covering parser.py's line_start/line_end spans - need a venv
      # and the tree-sitter-cpp grammar. Without them the suites self-skip, and
      # no job used to satisfy the guard: this one ran jest on a bare npm ci,
      # and test-property-extractor built the environment but ran only pytest.
      # Six assertions were dark behind a green check. `make venv treesitter`
      # only builds those two targets; it does not clone redpanda the way
      # `make build` does.
      - name: Set up Python for the property extractor
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tools/property-extractor/requirements.txt'

      - name: Cache the tree-sitter-cpp grammar
        uses: actions/cache@v4
        with:
          path: tools/property-extractor/tree-sitter/tree-sitter-cpp
          # Keyed on the files that hold the pinned grammar tag, so bumping the
          # pin in either place invalidates the cache instead of resurrecting a
          # checkout at the old tag.
          key: tree-sitter-cpp-${{ runner.os }}-${{ hashFiles('tools/property-extractor/Makefile', 'tools/lint-strings/surfaces/properties.js') }}

      - name: Bootstrap the property extractor (venv + tree-sitter grammar)
        run: make -C tools/property-extractor venv treesitter

      - name: Run tools tests
        run: npm test -- __tests__/tools/ __tests__/cli-utils/ __tests__/mcp/ __tests__/workflows/ --passWithNoTests

  test-property-extractor:
    needs: detect-changes
    # Skip on pull_request runs from a fork: forked PRs get neither the
    # OIDC id-token nor repo secrets this job's AWS auth step below needs,
    # so it would fail before "make build" ever runs. Same-repo PRs, pushes,
    # and the weekly schedule run are unaffected.
    if: (needs.detect-changes.outputs.property_extractor == 'true' || needs.detect-changes.outputs.all_tests == 'true' || github.event_name == 'schedule') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    # Needed to assume the AWS role below, which fetches the bot token that
    # authenticates the clone of streaming-enterprise (private) in the
    # "Generate test fixtures" step.
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}

      - uses: aws-actions/aws-secretsmanager-get-secrets@v2
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'tools/property-extractor/requirements.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache streaming-enterprise repository
        uses: actions/cache@v4
        with:
          path: tools/property-extractor/tmp/redpanda
          # Renamed from redpanda-repo-dev-* (pre-migration): that key's cached
          # clone has its origin remote pointed at the old public redpanda
          # repo, so restoring it would make the fetch step below silently
          # pull from the wrong repo instead of streaming-enterprise.
          key: streaming-enterprise-repo-dev-${{ steps.date.outputs.date }}
          restore-keys: |
            streaming-enterprise-repo-dev-

      - name: Cache tree-sitter build
        uses: actions/cache@v4
        with:
          path: |
            tools/property-extractor/tree-sitter/tree-sitter-cpp/build
            tools/property-extractor/tree-sitter/tree-sitter-cpp/node_modules
          key: tree-sitter-${{ runner.os }}-${{ hashFiles('tools/property-extractor/tree-sitter/tree-sitter-cpp/package-lock.json') }}
          restore-keys: |
            tree-sitter-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/property-extractor/requirements.txt

      - name: Generate test fixtures
        working-directory: tools/property-extractor
        env:
          GH_TOKEN: ${{ env.ACTIONS_BOT_TOKEN }}
        run: |
          make build

      - name: Run property-extractor tests
        run: |
          python -m pytest __tests__/tools/property-extractor/ -v --tb=short

  # Run all tests if core files changed or on schedule
  test-all:
    needs: detect-changes
    if: needs.detect-changes.outputs.package_json == 'true' || needs.detect-changes.outputs.all_tests == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The lint-strings properties surface and preview-string shell out to the
      # real Python property extractor, so their integration assertions - the
      # only ones covering parser.py's line_start/line_end spans - need a venv
      # and the tree-sitter-cpp grammar. Without them the suites self-skip, and
      # no job used to satisfy the guard: this one ran jest on a bare npm ci,
      # and test-property-extractor built the environment but ran only pytest.
      # Six assertions were dark behind a green check. `make venv treesitter`
      # only builds those two targets; it does not clone redpanda the way
      # `make build` does.
      - name: Set up Python for the property extractor
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'tools/property-extractor/requirements.txt'

      - name: Cache the tree-sitter-cpp grammar
        uses: actions/cache@v4
        with:
          path: tools/property-extractor/tree-sitter/tree-sitter-cpp
          # Keyed on the files that hold the pinned grammar tag, so bumping the
          # pin in either place invalidates the cache instead of resurrecting a
          # checkout at the old tag.
          key: tree-sitter-cpp-${{ runner.os }}-${{ hashFiles('tools/property-extractor/Makefile', 'tools/lint-strings/surfaces/properties.js') }}

      - name: Bootstrap the property extractor (venv + tree-sitter grammar)
        run: make -C tools/property-extractor venv treesitter

      # jest.unit.config.js extends jest.config.js's testPathIgnorePatterns
      # instead of repeating them here, because a CLI --testPathIgnorePatterns
      # REPLACES the config array rather than adding to it — which is how the
      # network-dependent CGO end-to-end test (excluded in jest.config.js) once
      # crept back into this job, where a GitHub download hiccup fails PRs that
      # never touched it. That test has its own workflow
      # (test-cgo-detection.yml) and npm script (npm run test:cgo).
      - name: Run all tests
        run: npm run test:unit -- --maxWorkers=2

  # The generated-files guard is a merge gate for other repos, so its bash gets
  # linted as well as tested. actionlint checks the workflow and shellchecks the
  # run: block it embeds; shellcheck checks .github/scripts/guard-generated-files.sh,
  # the file that block is generated from. Scoped to those two files on purpose:
  # a repo-wide actionlint run reports pre-existing findings in the other
  # workflows and would be red on arrival.
  lint-guard-workflow:
    needs: detect-changes
    if: needs.detect-changes.outputs.all_tests == 'true' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the guard workflow and its embedded bash
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7 -color .github/workflows/guard-generated-files.yml

      - name: Shellcheck the guard script
        run: docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:v0.10.0 .github/scripts/guard-generated-files.sh

  # Summary job that all other jobs depend on
  test-summary:
    if: always()
    needs: [detect-changes, test-extensions, test-macros, test-asciidoc-extensions, test-tools, test-property-extractor, test-all, lint-guard-workflow]
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        run: |
          # Check if any required job failed
          if [[ "${{ needs.test-extensions.result }}" == "failure" || "${{ needs.test-macros.result }}" == "failure" || "${{ needs.test-asciidoc-extensions.result }}" == "failure" || "${{ needs.test-tools.result }}" == "failure" || "${{ needs.test-property-extractor.result }}" == "failure" || "${{ needs.test-all.result }}" == "failure" || "${{ needs.lint-guard-workflow.result }}" == "failure" ]]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
