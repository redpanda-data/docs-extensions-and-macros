# A small taxonomy for unit tests, in the shape of
# redpanda-data/docs shared/modules/ROOT/attachments/taxonomy.yml.
# taxonomy.schema.json beside it is a copy of that repo's schema.
schema-version: 1
schemes:
  - id: topic
    prefLabel: Topic
    scopeNote: The capability or subject.
    cardinality: { docs: 0-3 }
    hierarchy: two-level
    assignment: authored
    concepts:
      - id: security
        prefLabel: Security
        altLabels: []
        definition: Protecting a cluster and its data.
        broader: null
        related: []
        deprecated: false
        replacedBy: []
      - id: high-availability
        prefLabel: High Availability
        altLabels: []
        definition: Keeping a cluster available through failures.
        broader: null
        related: []
        deprecated: false
        replacedBy: []
      - id: replication
        prefLabel: Replication
        altLabels: []
        definition: Copying partition data across brokers.
        broader: high-availability
        related: []
        deprecated: false
        replacedBy: []
      - id: tiered-storage
        prefLabel: Tiered Storage
        altLabels: []
        definition: Offloading log segments to object storage.
        broader: null
        related: []
        deprecated: false
        replacedBy: []
      - id: iceberg-topics
        prefLabel: Iceberg Topics
        altLabels: []
        definition: Topics that write Apache Iceberg tables.
        broader: null
        related: [apache-iceberg]
        implies: [apache-iceberg]
        deprecated: false
        replacedBy: []
      - id: category-iceberg
        prefLabel: Iceberg
        altLabels: []
        definition: The old Iceberg category, replaced by Iceberg Topics.
        broader: null
        related: []
        deprecated: true
        replacedBy: [iceberg-topics]
      - id: category-data-replication
        prefLabel: Data Replication
        altLabels: []
        definition: The old category, replaced by Replication.
        broader: null
        related: []
        deprecated: true
        replacedBy: [replication]
      - id: category-integration
        prefLabel: Integration
        altLabels: []
        definition: The old category with no single replacement.
        broader: null
        related: []
        deprecated: true
        replacedBy: []
  - id: task
    prefLabel: Task
    scopeNote: What the reader is doing.
    cardinality: { docs: 1-1 }
    hierarchy: flat
    assignment: defined
    concepts:
      - id: operate
        prefLabel: Operate
        altLabels: [Day-2 operations]
        definition: Running a deployment day to day.
        broader: null
        related: []
        deprecated: false
        replacedBy: []
      - id: category-management
        prefLabel: Management
        altLabels: []
        definition: The old top-level category, replaced by Operate.
        broader: null
        related: []
        deprecated: true
        replacedBy: [operate]
  - id: content-type
    prefLabel: Content type
    scopeNote: The kind of page.
    cardinality: { docs: 1-1 }
    hierarchy: flat
    assignment: authored
    concepts:
      - id: concept
        prefLabel: Concept
        altLabels: [Concepts]
        definition: Explains what something is and how it works.
        broader: null
        related: []
        deprecated: false
        replacedBy: []
  - id: use-case
    prefLabel: Use case
    scopeNote: What the reader is building.
    cardinality: { docs: 0-3, solutions: 1-3 }
    hierarchy: flat
    assignment: authored
    concepts:
      - id: stream-processing
        prefLabel: Stream processing
        altLabels: []
