# ${{ env.X }} resolved through the env chain: workflow, job, then step.
name: Env form
on: [push]
env:
  TARGET_REPO: redpanda-data/docs
  EVENT: from-workflow-env
jobs:
  one:
    runs-on: ubuntu-latest
    env:
      EVENT: from-job-env
    steps:
      - uses: peter-evans/repository-dispatch@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          event-type: ${{ env.EVENT }}
      - uses: peter-evans/repository-dispatch@v4
        env:
          EVENT: from-step-env
        with:
          repository: ${{ env.TARGET_REPO }}
          event-type: ${{ env.EVENT }}
