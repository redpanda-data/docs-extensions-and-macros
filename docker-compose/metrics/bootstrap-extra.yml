# =================================================================
# Extra cluster properties for `doc-tools generate metrics-docs`.
#
# Redpanda exports a metric family only when the feature that registers it is
# on. These properties turn on features the quickstart leaves off, so the
# scrape covers their metrics. generate-cluster-docs.sh appends this file to
# the quickstart bootstrap.yml in metrics mode. It is not part of the
# quickstart that readers download.
#
# Redpanda 25.3 and later log a warning for a property they do not know and
# start anyway. Earlier releases refuse to start, so the script leaves this
# file out for them.
# =================================================================

# redpanda_cluster_health_* and vectorized_cluster_health_*
health_monitor_metrics_enabled: true
# redpanda_kafka_quotas_client_quota_*_by_entity
kafka_per_entity_quota_metrics: true
# *_cluster_partition_schema_id_validation_records_failed
enable_schema_id_validation: redpanda
# vectorized_internal_rpc_latency
enable_development_metrics: true
# redpanda_cloud_storage_anomalies
cloud_storage_enable_scrubbing: true
