# Macro test harness: the FULL local playbook, pointed at work-in-progress
# branches and using the macros and extensions from this working tree.
#
# Identical to local-antora-playbook.yml except for:
#   - the docs and cloud-docs content sources, which track the WIP branches
#   - a separate output directory and log, so it never clobbers your normal build
#
# __tests__/playbook-parity.test.js enforces that claim for the extension list.
# It had drifted: two extensions were registered only in the other playbook, so
# this harness reported on a build where they never ran, and their diagnostic
# counters read zero -- indistinguishable from "no problems found".
#
#   ./scripts/macro-test.sh              build, then a focused report
#   ./scripts/macro-test.sh --serve      build, report, serve on :5002
#   DOCS_DIR=~/Documents/docs ./scripts/macro-test.sh    use a local checkout
#
# The docs repo is private, so export REDPANDA_GITHUB_TOKEN first.

site:
  title: Redpanda Docs Extensions and Macros
  start_page: preview:ROOT:test.adoc
  url: https://docs-extensions-and-macros.netlify.app
urls:
  html_extension_style: indexify
output:
  clean: true
  # Separate from the normal build so the two never clobber each other.
  dir: ./macro-test-out
runtime:
  log:
    level: warn
content:
  sources:
  - url: .
    branches: HEAD
    start_paths: [preview/extensions-and-macros, preview/shared, preview/home,
                 preview/macro-fixtures-beta, preview/macro-fixtures-cloud]
  # WIP: jake/property-source-attributes stands in for main (it is branched
  # from it) and carries the page-property-source declarations. v/26.1 and
  # v/25.3 are where the 586 and 607 prop: calls live, so they are what
  # exercises the macro at scale. Narrow this list for a faster build.
  - url: https://github.com/redpanda-data/docs
    branches: [jake/property-source-attributes, v/26.1, v/25.3, api, 'site-search']
  - url: https://github.com/redpanda-data/redpanda-labs
    branches: main
    start_paths: [docs,'*/docs']
  - url: https://github.com/redpanda-data/rp-connect-docs
    branches: main
  # WIP: this branch has the prop: calls in Cloud prose, so it exercises the
  # cloud_supported gate. Swap for jake/property-source-attributes to test the
  # declarations on Cloud's own pages instead.
  - url: https://github.com/redpanda-data/cloud-docs
    branches: [DOC-887-prop-macro-adoption]
ui:
  bundle:
    url: https://github.com/redpanda-data/docs-ui/releases/latest/download/ui-bundle.zip
    snapshot: true
asciidoc:
  attributes:
    # 'error' fails the build instead; 'off' silences these.
    property-validate: warn
    enterprise-validate: warn
  extensions:
  - '@asciidoctor/tabs'
  - './macros/glossary'
  - './macros/config-ref'
  - './macros/badge'
  - './macros/enterprise'
  - './macros/prop'
  - './macros/helm-ref'
  - './macros/rp-connect-components'
  - './asciidoc-extensions/add-line-numbers-highlights'
antora:
  extensions:
  - require: './extensions/add-global-attributes'
  - './extensions/version-fetcher/set-latest-version'
  - './extensions/algolia-indexer/index'
  - require: './extensions/generate-rp-connect-info'
  - require: './extensions/collect-bloblang-samples'
  - require: './extensions/generate-rp-connect-categories'
  - require: './extensions/generate-index-data'
    data:
      sets:
        docker_labs:
          component: labs
          filter: docker-compose
          env_type: Docker
          attribute_name: docker-labs-index
  - require: './extensions/add-pages-to-root'
  - require: './extensions/unlisted-pages'
  - require: './extensions/git-full-clone'
  - require: './extensions/add-git-dates'
  - require: './extensions/add-faq-structured-data'
  - require: './extensions/convert-to-markdown'
  - require: './extensions/replace-attributes-in-attachments'
    data:
      replacements:
        - components:
          - 'streaming'
          - 'labs'
          file_patterns:
            - '**/docker-compose.yaml'
            - '**/docker-compose.yml'
        - components:
            - 'home'
          file_patterns:
            - '**/llms.adoc'
  - require: './extensions/resolve-xrefs-in-attachments'
  - require: './extensions/url-to-xref'
  - require: './extensions/convert-llms-to-txt.js'
  - require: './extensions/convert-sitemap-to-markdown'
  - require: './extensions/archive-attachments'
    data:
      archives:
        - component: 'preview'
          output_archive: 'test.tar.gz'
          file_patterns:
            - '**/test.yaml'
  - require: './extensions/compute-end-of-life'
    data:
      eol_settings:
        - component: 'preview'
          supported_months: 12
          warning_weeks: 8
          eol_doc: https://support.redpanda.com/hc/en-us/articles/20617574366743-Redpanda-Supported-Versions
          upgrade_doc: ROOT:upgrade:index.adoc
  - require: './extensions/unpublish-pages'
  - require: './extensions/validate-attributes'
  - require: './extensions/find-related-docs'
  - require: './extensions/find-related-labs'
  - require: './extensions/generate-fields-only-pages'
    enabled: true
  - require: './extensions/aggregate-terms'
  - require: './extensions/property-page-index'
  - require: './extensions/set-available-attachment-versions'
  - require: './extensions/render-property-descriptions'

