# A real self-managed docs component (named exactly 'streaming') is what
# lends Cloud its GA property data in production -- macros/prop.js only
# recognizes components literally named 'streaming' or 'ROOT' as lenders.
# The full macro-test.sh harness gets that for free from the real docs repo.
# This lightweight showcase does not pull that repo, so this fixture plays
# the same role with little more than the files Cloud actually reads: the GA
# properties, rpk and metrics attachments macro-fixtures-cloud validates
# against, a few stand-in rpk reference pages (no nav) for rpkcmd: to link,
# one of which macro-fixtures-cloud includes as cloud-docs stubs do, and a
# stand-in metrics reference page for metric: that it includes the same way. The pages that
# rpk descriptions link by docs URL come from preview/links-lender-streaming.
name: streaming
title: Streaming GA data (lender-only fixture)
version: '26.2'
