# lint-strings test fixture: helm-docs conventions with known-bads and
# conforming counterparts.

# -- Enable or disable the thing entirely. This description conforms.
enabled: true

# -- Image settings for the fixture chart.
image:
  # -- The container image repository to pull from.
  repository: docker.redpanda.com/redpandadata/redpanda
  tag: latest

# -- Service settings that were commented out wholesale. The nested markers
# below are dead: they use the indented `#   -- ` form, which helm-docs does
# not recognize as a marker at all, so no pipeline can attach them.
# service:
#   -- set service.name to override the default service name
#   name: redpanda
#   -- internal Service settings
#   internal:
#     annotations: {}


# A marker separated from the next key by blank lines is NOT dead: helm-docs
# ignores the gap and hands it to the next real key below, which is `resources`.
# -- Orphaned marker; helm-docs attaches this to the next real key.

# @doc external.domain -- Optional domain advertised to external clients.
# @default -- `nil`

resources:
  # -- Requested CPU cores. Commented-out key documented in place:
  # cpu: 1

# @ignored
internalHiddenKey: {}

misattached:
  # -- Written for the commented-out key below, but with no blank line and no
  # later marker, helm-docs hands this text to realKeyBelow instead.
  # optionalKey:
  realKeyBelow: value
  # -- Written for the commented-out key below. The real key that follows has
  # its own marker, so helm-docs uses that one and nothing is misattached.
  # anotherOptional:
  # -- The guarded key's own description.
  guarded: value

undocumentedTopLevel:
  child: value

config: |
  # -- inside a block scalar this marker is content, not documentation
  some: content

# -- External access settings.
external:
  # -- Optional domain advertised to external clients. Hyphenated key names
  # must survive both the generator and the linter.
  # my-domain: local
