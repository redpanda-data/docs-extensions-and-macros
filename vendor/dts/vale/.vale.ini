# Redpanda documentation style for Vale (https://vale.sh).
# Rules implement resources/writing-style/ and resources/content-architecture.md;
# each rule file links to the section it enforces. Only rules a regex can
# decide live here. Voice, structure, personas, and whether an objective is
# any good stay with the review skill.
StylesPath = styles
MinAlertLevel = suggestion

[*.adoc]
BasedOnStyles = Redpanda
# Page metadata applies to pages, not partials or nav files. So does
# Acronyms: a partial's acronyms are spelled out by the page that includes it.
Redpanda.TopicTypeMissing = NO
Redpanda.DescriptionMissing = NO
Redpanda.PersonasMissing = NO
Redpanda.Acronyms = NO

[**/pages/**/*.adoc]
Redpanda.TopicTypeMissing = YES
Redpanda.DescriptionMissing = YES
Redpanda.PersonasMissing = YES
Redpanda.Acronyms = YES

# Nav entries may name rpk commands bare.
[**/nav.adoc]
Redpanda.Rpk = NO
Redpanda.SingleItemList = NO

# The Self-Managed release-notes page lists each area's entries as bullets
# under its Area:: term, so an area with one entry has a one-item list.
# See resources/writing-style/release-notes.md.
[**/pages/releases/redpanda.adoc]
Redpanda.SingleItemList = NO
