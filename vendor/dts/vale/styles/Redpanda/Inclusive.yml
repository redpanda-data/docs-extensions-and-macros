# Checks: whitelist and blacklist
extends: substitution
message: "Use '%s' instead of '%s'."
link: https://github.com/redpanda-data/docs-team-standards/blob/main/resources/writing-style/style-guide.md#terminology-quick-reference
level: error
ignorecase: true
swap:
  whitelist(?:ed|s|ing)?: allowlist
  blacklist(?:ed|s|ing)?: denylist
