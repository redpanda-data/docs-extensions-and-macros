# Checks: 'should' that states a requirement (keep it for a recommendation or the reader's goal; judge each hit, never swap the word)
extends: existence
message: "If this '%s' states a requirement, use 'must'. Keep it for a recommendation or what the reader wants."
link: https://github.com/redpanda-data/docs-team-standards/blob/main/resources/writing-style/terminology.md#do-not-use-word-list
level: warning
ignorecase: true
tokens:
  - '\bshould\b'
