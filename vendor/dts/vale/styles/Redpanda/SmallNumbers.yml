# Checks: numerals one to nine in compounds such as '3-node'
extends: existence
message: "Spell out whole numbers from one to nine in prose ('%s')."
link: https://github.com/redpanda-data/docs-team-standards/blob/main/resources/writing-style/style-guide.md#numbers
level: warning
tokens:
  - '\b[1-9]-(?:node|broker|zone|replica|partition|step|day|week|minute|hour)\b'
