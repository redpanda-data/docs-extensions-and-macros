# Checks: longer words where a short one works, such as utilize, leverage, initiate, and approximately
extends: substitution
message: "Use '%s' instead of '%s'."
link: https://github.com/redpanda-data/docs-team-standards/blob/main/resources/writing-style/style-guide.md#specific-guidance
level: error
ignorecase: true
swap:
  utiliz(?:e|es|ed|ing): use
  facilitat(?:e|es|ed|ing): help
  leverag(?:e|es|ed|ing): use
  initiat(?:e|es|ed|ing): start
  approximately: about
  in order to: to
